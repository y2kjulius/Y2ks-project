<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dino Run - 恐龙跑酷</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #f7f7f7;
    font-family: "Courier New", Courier, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    /* a phone must never select the page, flash a tap highlight, or pop the
       "copy / save image" callout when a thumb rests on the canvas */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  #wrap {
    text-align: center;
    user-select: none;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    padding: 0 8px;
  }
  h1 {
    color: #535353;
    font-size: 20px;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  #game {
    background: #fff;
    width: 100%;
    height: auto;
    border: 2px solid #535353;
    border-radius: 8px;
    display: block;
    margin: 0 auto;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  }
  kbd {
    background: #eee;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 12px;
  }

  /* ---- version chooser: the cave the run ends in ---------------------------------
     Black, no pictures of the game, no instructions. The crowd standing on the
     floor is the same crowd that greets him at the finish, so the first screen
     quietly gives the ending away - which is the point. */
  #chooser {
    position: fixed;
    inset: 0;
    z-index: 40;
    overflow: hidden;
    background: #06050a;
  }
  #chooser #boot {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }
  #chooser .boot-ui {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 5vh, 52px);
    padding: 0 18px 9vh;
    pointer-events: none;          /* the cave keeps the stray taps */
  }
  /* the title: gradient fill, hard offset shadow, warm bloom - a poster word,
     not a label */
  #chooser .brand {
    font-family: "Impact", "Arial Black", "Helvetica Neue", sans-serif;
    font-weight: 900;
    font-size: clamp(42px, 12vw, 116px);
    line-height: 0.9;
    letter-spacing: 0.055em;
    padding-left: 0.055em;         /* the trailing letter-space, balanced */
    transform: skewX(-4deg);
    background: linear-gradient(178deg, #fffaf0 0%, #ffd982 30%, #f59331 60%, #a3400f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 3px 0 #6d280a)
            drop-shadow(0 5px 1px rgba(30, 8, 0, 0.65))
            drop-shadow(0 0 34px rgba(255, 132, 42, 0.42));
    animation: bootBreath 5.2s ease-in-out infinite;
  }
  @keyframes bootBreath {
    0%, 100% { filter: drop-shadow(0 3px 0 #6d280a) drop-shadow(0 5px 1px rgba(30,8,0,0.65)) drop-shadow(0 0 30px rgba(255,132,42,0.34)); }
    50%      { filter: drop-shadow(0 3px 0 #6d280a) drop-shadow(0 5px 1px rgba(30,8,0,0.65)) drop-shadow(0 0 46px rgba(255,150,60,0.62)); }
  }
  @media (max-aspect-ratio: 1/1) {
    #chooser .brand { font-size: clamp(48px, 17vw, 116px); }
  }
  #chooser .picks {
    display: flex;
    gap: 12px;
    pointer-events: auto;
  }
  #chooser .picks button {
    font: inherit;
    font-size: 12.5px;
    letter-spacing: 3px;
    padding: 8px 21px 8px 24px;
    color: #f0ddc2;
    background: rgba(255, 236, 208, 0.05);
    border: 1px solid rgba(255, 208, 142, 0.38);
    border-radius: 999px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background .16s, border-color .16s, color .16s;
  }
  #chooser .picks button:hover {
    background: rgba(255, 190, 110, 0.16);
    border-color: rgba(255, 214, 150, 0.78);
    color: #fff4e2;
  }
  #chooser .picks button:active {
    transform: translateY(1px);
    background: rgba(255, 190, 110, 0.28);
  }

  /* ---- the phone build's two thumb buttons ---- */
  #touch {
    position: fixed;
    inset: 0;
    z-index: 30;
    pointer-events: none;
  }
  #touch button {
    position: absolute;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    width: 92px;
    height: 92px;
    border-radius: 50%;
    font: 700 20px "Courier New", Courier, monospace;
    color: #fff;
    background: rgba(70, 70, 70, 0.42);
    border: 2px solid rgba(255, 255, 255, 0.6);
    pointer-events: auto;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #btnDuck { left: calc(22px + env(safe-area-inset-left, 0px)); }
  #btnJump { right: calc(22px + env(safe-area-inset-right, 0px)); }
  #touch button.down { background: rgba(70, 70, 70, 0.72); }
  /* The phone splits the screen down the middle instead of offering two small
     discs: everything left of the seam ducks, everything right of it jumps. The
     discs stay where they were as a reminder of which thumb owns which side —
     a thumb that lands beside one, or on the empty page below the frame, still
     does the right thing. That is what the discs could never guarantee. */
  #touch .zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    pointer-events: auto;
    touch-action: none;
  }
  #zoneDuck { left: 0; }
  #zoneJump { right: 0; }
  /* The discs are a reminder of which thumb owns which half — nothing more. On
     a landscape phone the frame fills the screen, so a 92px disc would sit on
     top of the runner himself; it fades out a beat after the run starts and
     comes back on the select / retry screens. The halves keep working either
     way, so nothing is lost. */
  body.mobile #touch button { transition: opacity .45s ease .8s; }
  body.mobile.running #touch button { opacity: 0; }
  /* one frame for the whole run on a phone: no growth at a stage change */
  body.mobile { background: #14120f; overflow: hidden; }
  body.mobile #wrap { padding: 0; }
  body.mobile h1 { display: none; }
  body.mobile #stage { max-width: none; }
  /* one icon, top-right: the gear now owns the help pages too, so the phone
     drops the "?" and hands the whole top edge to the clock and the bar. */
  body.mobile #gear { left: auto; right: calc(var(--hud, 40px) * 0.21); }
  body.mobile #helpBtn { display: none; }
  body.mobile #panel { left: auto; right: calc(var(--hud, 40px) * 0.21); }
  /* the frame is one size for every stage; the shadow lifts it off the page.
     Landscape: the canvas keeps its own 3:1 and is only ever shrunk to fit the
     viewport — width first when held upright, height first when held sideways,
     so the same page works in both grips without stretching. */
  body.mobile #game {
    border-color: #2b2823;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.55);
    width: auto;
    height: auto;
    /* -4px: the 2px border on each side is part of the box, and without it the
       right edge of the frame sits one border outside the viewport */
    max-width: calc(100vw - 4px);
    max-height: 100vh;
    max-height: 100dvh;
  }
  .hidden { display: none !important; }

  /* ---- the canvas and its two HUD buttons share one anchored box, so the
     buttons ride the edge of the canvas instead of the corner of the window:
     on a wide screen those are nowhere near each other ---- */
  #stage {
    position: relative;
    display: block;
    width: 100%;
    max-width: calc(800px + 4px);   /* the canvas plus its border */
    margin: 0 auto;
    line-height: 0;
  }

  /* ---- round HUD buttons: gear (top left) and help (top right) --------------
     --hud is set from JS to a fraction of the canvas width (56px at 800 wide,
     ~32px on a phone). A fixed 56 disc looked fine on a desktop and ate a fifth
     of a phone screen, so both the disc and everything anchored to it scale
     together. All the offsets below are ratios of it. */
  .hudbtn {
    position: absolute;
    z-index: 35;
    width: var(--hud, 56px);
    height: var(--hud, 56px);
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #5a5a56;
    background: rgba(255, 255, 255, 0.9);
    border: 1.6px solid #cbcbc4;
    border-radius: 50%;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    transition: background .12s, color .12s, border-color .12s;
  }
  .hudbtn svg { width: 62%; height: 62%; display: block; }
  .hudbtn:active { background: #ececec; }
  .hudbtn.on { color: #fff; background: #535353; border-color: #535353; }
  #gear {
    top: calc(var(--hud, 56px) * 0.14);
    left: calc(var(--hud, 56px) * 0.21);
  }
  #helpBtn {
    top: calc(var(--hud, 56px) * 0.14);
    right: calc(var(--hud, 56px) * 0.21);
    font-size: calc(var(--hud, 56px) * 0.55);
    font-weight: 700;
    line-height: 1;
    padding-bottom: calc(var(--hud, 56px) * 0.018);
  }

  #panel {
    position: absolute;           /* under the gear, inside the stage */
    top: calc(var(--hud, 56px) * 1.32);
    left: calc(var(--hud, 56px) * 0.21);
    z-index: 36;
    width: 200px;
    padding: 7px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    background: rgba(255, 255, 255, 0.97);
    border: 1.5px solid #d8d8d8;
    border-radius: 10px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
  }
  #panel button {
    font: inherit;
    font-size: 13.5px;
    text-align: left;
    padding: 12px 13px;
    color: #444;
    background: transparent;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  #pnHelp { display: none; }
  body.mobile #pnHelp { display: block; }
  #panel button:hover { background: #f2f2f2; }
  #panel button:active { background: #e9e9e9; }

  /* ---- the help pages ---- */
  #help {
    position: fixed;
    inset: 0;
    z-index: 45;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    background: rgba(240, 239, 235, 0.96);
  }
  .help-shell {
    width: min(640px, 100%);
    /* one fixed box for all three tabs, so switching never resizes the page */
    height: min(540px, calc(100vh - 24px));
    max-height: 100%;
    display: flex;
    flex-direction: column;
    background: #fff;
    border: 1.5px solid #e3e1db;
    border-radius: 14px;
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.10);
    overflow: hidden;
  }
  .help-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid #efede8;
    background: #fbfaf8;
  }
  .tabs { display: flex; gap: 6px; flex: 1; }
  .tab {
    font: inherit;
    font-size: 13px;
    padding: 7px 15px;
    color: #6f6d66;
    background: #fff;
    border: 1px solid #dcdad3;
    border-radius: 999px;
    cursor: pointer;
  }
  .tab.on { color: #fff; background: #535353; border-color: #535353; }
  #helpClose {
    width: 30px;
    height: 30px;
    flex: 0 0 30px;
    font: inherit;
    font-size: 13px;
    color: #777;
    background: #fff;
    border: 1px solid #dcdad3;
    border-radius: 50%;
    cursor: pointer;
  }
  .help-body {
    padding: 16px 20px 30px;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* ---- the keys page: one abstract keyboard + mouse ----------------------
     Every function is written on the picture itself, so the page does not
     need a key-by-key list standing next to it. */
  .kfig { margin: 8px 0 2px; }
  .kfig svg { display: block; width: 100%; height: auto; }
  .kfig-note {
    margin: 8px 0 4px;
    font-size: 12.5px;
    line-height: 1.85;
    color: #8d8a82;
  }

  /* ---- obstacle + stage galleries ---- */
  .ogroup {
    padding: 4px 10px 12px;
    margin: 0 0 12px;
    border: 1px solid transparent;
    border-radius: 12px;
  }
  .ogroup h3 { margin: 14px 0 10px; }
  .ogroup:first-of-type h3 { margin-top: 8px; }
  .ogrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  /* a group with two entries should not leave half a row empty */
  .ogroup .ogrid.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 360px; margin: 0 auto; }
  .ogroup .ogrid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ocell {
    padding: 10px 7px 12px;
    text-align: center;
    background: #fff;
    border: 1px solid #eeece5;
    border-radius: 10px;
  }
  .opic {
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
  }
  .opic img { max-width: 100%; max-height: 100%; display: block; }
  .ocell b {
    display: block;
    margin-top: 8px;
    font-size: 12.5px;
    font-weight: 600;
    color: #3a3a36;
  }
  .ocell em {
    display: block;
    margin-top: 4px;
    font-style: normal;
    font-size: 11px;
    line-height: 1.5;
    color: #96938a;
  }
  /* light red behind the icon = it cannot be cleared without a double jump */
  .ocell.req-dj .opic { background: #fdeae3; }
  .olegend {
    display: flex;
    align-items: center;
    gap: 7px;
    margin: 10px 0 12px;
    font-size: 11.5px;
    color: #8d8a82;
  }
  .olegend .sw {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    background: #fdeae3;
    border: 1px solid #f4d3c8;
  }

  /* each stage block wears the colour that stage actually has in the run */
  .ogroup.tone-1 { background: #fdf6e7; border-color: #f2e4c4; }
  .ogroup.tone-1 h3 { color: #b08a45; }
  .ogroup.tone-1 .ocell { background: #fffdf8; border-color: #f1e5cb; }
  .ogroup.tone-2 { background: #eef1f5; border-color: #dde3ea; }
  .ogroup.tone-2 h3 { color: #7b8a9b; }
  .ogroup.tone-2 .ocell { background: #fcfdfe; border-color: #e2e7ee; }
  .ogroup.tone-3 { background: #17181c; border-color: #26282e; }
  .ogroup.tone-3 h3 { color: #8e8e96; }
  .ogroup.tone-4 { background: #1a1410; border-color: #2c2119; }
  .ogroup.tone-4 h3 { color: #a8895f; }
  .ogroup.tone-3 .ocell,
  .ogroup.tone-4 .ocell {
    background: rgba(255, 255, 255, 0.055);
    border-color: rgba(255, 255, 255, 0.09);
  }
  .ogroup.tone-3 .opic,
  .ogroup.tone-4 .opic { background: #efede6; }
  .ogroup.tone-3 .ocell b { color: #f2f0ea; }
  .ogroup.tone-4 .ocell b { color: #f1e7d8; }
  .ogroup.tone-3 .ocell em { color: #a5a29a; }
  .ogroup.tone-4 .ocell em { color: #b39a80; }
  .ogroup.tone-3 .ocell.req-dj .opic,
  .ogroup.tone-4 .ocell.req-dj .opic { background: #fdeae3; }

  .sgrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-top: 14px;
  }
  .scard {
    background: #fbfaf7;
    border: 1px solid #eeece5;
    border-radius: 10px;
    overflow: hidden;
  }
  .scard img { display: block; width: 100%; height: auto; }
  .scard b {
    display: block;
    padding: 11px 12px 0;
    font-size: 12.5px;
    font-weight: 600;
    color: #3a3a36;
  }
  .scard p {
    padding: 6px 12px 13px;
    font-size: 12px;
    line-height: 1.65;
    color: #85827a;
  }

  @media (max-width: 560px) {
    .ogrid,
    .ogroup .ogrid[class*="c"] { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: none; }
    /* a 200px panel covers half a phone canvas - give it back */
    #panel { width: 168px; }
    #panel button { font-size: 12.5px; padding: 10px 11px; }
  }
  .pane h3 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #9c9990;
    margin: 24px 0 12px;
  }
  .pane h3:first-child { margin-top: 12px; }
  .krow {
    display: flex;
    gap: 12px;
    align-items: baseline;
    font-size: 13px;
    line-height: 1.55;
    color: #454540;
    padding: 3px 0;
  }
  .krow .k {
    flex: 0 0 118px;
    color: #8d8a82;
    font-size: 12px;
  }
  .orow {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px dashed #f0eee9;
  }
  .oic {
    flex: 0 0 26px;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .oic svg { width: 22px; height: 22px; fill: currentColor; }
  .orow b {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #3a3a36;
  }
  .orow em {
    display: block;
    font-style: normal;
    font-size: 11.5px;
    color: #8d8a82;
    margin-top: 1px;
    line-height: 1.45;
  }
  .sblock {
    padding: 10px 12px;
    margin: 8px 0;
    background: #fbfaf7;
    border-left: 3px solid #d8d5cc;
    border-radius: 0 8px 8px 0;
  }
  .sblock b { font-size: 13px; color: #3a3a36; }
  .sblock p { font-size: 12.5px; color: #6f6d66; line-height: 1.6; margin-top: 3px; }
  .stable {
    display: grid;
    grid-template-columns: 1fr 1.6fr;
    gap: 4px 12px;
    font-size: 12.5px;
    color: #55524c;
    margin-top: 10px;
  }
  .stable span:nth-child(odd) { color: #8d8a82; }

</style>
</head>
<body>

<div id="help" class="hidden">
  <div class="help-shell">
    <div class="help-head">
      <div class="tabs">
        <button class="tab on" data-tab="keys">操作</button>
        <button class="tab" data-tab="obs">障碍物</button>
        <button class="tab" data-tab="stage">阶段</button>
      </div>
      <button id="helpClose" aria-label="关闭">✕</button>
    </div>
    <div class="help-body">

      <section class="pane" data-pane="keys">
        <div class="kfig" id="keysFig"></div>
        <p class="kfig-note">
          手机版：屏幕右半个随便点都是跳（连点两次 = 二段跳），左半个随便按住都是蹲（按住不放 = 滑翔）。<br>
          左上齿轮 / 右上 ? 打开菜单与说明，打开时游戏暂停；碰到障碍即结束，点屏幕重来。
        </p>
      </section>

      <section class="pane hidden" data-pane="obs">
        <div class="olegend"><span class="sw"></span>浅红底 = 必须二段跳</div>
        <div id="obsGrid"></div>
      </section>

      <section class="pane hidden" data-pane="stage">
        <div id="stageGrid"></div>
      </section>

    </div>
  </div>
</div>

<div id="wrap">
  <h1>🦖 DINO RUN</h1>
  <div id="stage">
    <canvas id="game" width="800" height="240"></canvas>

    <!-- gear (top left): the few things that act on the run -->
    <button id="gear" class="hudbtn" aria-label="菜单">
      <svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd">
        <path d="M9.78 4.73 L10.32 1.94 L13.68 1.94 L14.22 4.73 L14.91 4.98 L15.57 5.29 L17.92 3.70 L20.30 6.08 L18.71 8.43 L19.02 9.09 L19.27 9.78 L22.06 10.32 L22.06 13.68 L19.27 14.22 L19.02 14.91 L18.71 15.57 L20.30 17.92 L17.92 20.30 L15.57 18.71 L14.91 19.02 L14.22 19.27 L13.68 22.06 L10.32 22.06 L9.78 19.27 L9.09 19.02 L8.43 18.71 L6.08 20.30 L3.70 17.92 L5.29 15.57 L4.98 14.91 L4.73 14.22 L1.94 13.68 L1.94 10.32 L4.73 9.78 L4.98 9.09 L5.29 8.43 L3.70 6.08 L6.08 3.70 L8.43 5.29 L9.09 4.98 Z M15.40 12.00 a3.40 3.40 0 1 0 -6.80 0 a3.40 3.40 0 1 0 6.80 0 Z"/>
      </svg>
    </button>
    <div id="panel" class="hidden">
      <!-- phone only: the "?" that used to sit in the other corner lives here -->
      <button id="pnHelp">操作说明 / 图鉴</button>
      <button id="pnRestart">重新开始</button>
      <button id="pnMode">切换模式 / 难度</button>
      <button id="pnVersion">切换版本</button>
    </div>

    <!-- help (top right): everything that used to be printed under the canvas -->
    <button id="helpBtn" class="hudbtn" aria-label="说明">?</button>
  </div>

  <!-- first thing the player sees: pick a build. The game behind it is already
       armed on 简单 · 1 分钟, so either choice drops straight into that scene.
       The cave itself is painted on #boot by drawBootScene(). -->
  <div id="chooser">
    <canvas id="boot"></canvas>
    <div class="boot-ui">
      <div class="brand">DINO RUN</div>
      <div class="picks">
        <button id="pickPC">电脑</button>
        <button id="pickMobile">手机</button>
      </div>
    </div>
  </div>

  <!-- phone build only. The two discs mark the thumbs' homes, but the whole
       left half of the screen ducks and the whole right half jumps. -->
  <div id="touch" class="hidden">
    <div class="zone" id="zoneDuck"></div>
    <div class="zone" id="zoneJump"></div>
    <button id="btnDuck">蹲</button>
    <button id="btnJump">跳</button>
  </div>

</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  let ctx = canvas.getContext('2d');   // swappable: the help page renders sprites
  // 800 is the world the game was tuned on. The phone shows the SAME slice —
  // not a narrower one — because its frame is landscape now: a phone held
  // sideways is ~2.1:1, so a 800x400 plate lands on the whole screen at 1:1.
  // (v2.4 used 640x480: correct maths, portrait shape. That was the mistake.)
  const DESKTOP_W = 800, MOBILE_W = 1200;
  let W = DESKTOP_W;             // the visible slice, set when a build is picked
  const BASE_H = 240;            // stage 1 canvas height
  const BIG_H = BASE_H * 2;      // stage 2 canvas height (doubled)
  const MOBILE_H = 400;          // the phone plate: 1200x400 = 3:1, flatter still
  const GROUND_GAP = 40;         // px from bottom to the ground line
  const STAGE2_SCORE = 100;      // 0-100     -> stage 1
  const STAGE3_SCORE = 300;      // 100-300   -> stage 2
  const STAGE4_SCORE = 500;      // 300-500   -> stage 3 (night pursuit)
                                 // 500-700   -> stage 4 (cave)

  // ==========================================================================
  //  SPEED-RUN MODES
  // --------------------------------------------------------------------------
  //  A run starts in the cave (stages 1-3 are all still in the file, they are
  //  simply never entered) and ends after a chosen length of time.
  //
  //  Everything hangs off one invariant: PX_PER_SCORE. The dino earns exactly
  //  one point per 73.33 px of track, no matter how fast it is going, so the
  //  "distance : score" ratio never drifts. The world gets faster as the run
  //  goes on, and the score *rate* speeds up with it — the ratio stays put.
  // ==========================================================================
  const CAVE_ONLY = true;                     // the timed speed-run modes
  const STAGE4_ONLY = false;                  // this build keeps all four stages
  const PX_PER_SCORE = 11 / 0.15;             // 73.33 px of track = 1 point
  const REF_SPEED = 11;                       // the speed every spacing rule was tuned at

  // Speed ramps linearly with progress p = score/target, so
  //   dp/dstep = s(p) / (PX_PER_SCORE * target)
  // which integrates to
  //   steps = (PX_PER_SCORE * target) / (s1 - s0) * ln(s1/s0)
  // Inverting that gives the target score for a run of `seconds` (60 logic
  // steps per second — see the fixed-step loop at the bottom of this file).
  // Each mode brings its own ramp (see MODES below), so the target is measured
  // against the ramp it will actually be run on.
  // Verified against a step-by-step simulation: 30 s at 11->18 -> 349,
  // 60 s at 10->18 -> 668, 120 s at 10->18 -> 1336, each landing within a frame
  // or two of its nominal length.
  function targetScore(seconds, s0, s1) {
    const steps = seconds * 60;
    return Math.round(steps * (s1 - s0) / (PX_PER_SCORE * Math.log(s1 / s0)));
  }
  // Each mode runs the stages back to back on a TIME schedule: [stage, seconds].
  // `blocking` decides what a stage change does to the world:
  //   false — nothing stops. The banner pops up, the screen height eases to its
  //           new value and the obstacles keep coming straight through.
  //   true  — the classic ceremony: hold the spawns, wait for the screen to
  //           clear, play the change out, banner, short breath, carry on.
  // They also sum to exactly the mode's length.
  // `intro` is a lead-in in seconds, played before the clock starts: the world is
  // held still and the run itself is unaffected (the reserved second is EXTRA).
  // `s0`/`s1` are that mode's own speed ramp — the sprint pulls away from 11.
  // `pace` is this distance's own tightness: the sprint is packed, the two long
  // runs breathe. `calm` lets the 2-minute run hand out empty stretches late on.
  // `bigPools` gives the long runs the extra-huge lava lakes.
  const MODES = [
    { name: '30 秒 · 闪电', sec: 30,  blocking: false, intro: 1, s0: 11, s1: 18,
      pace: 0.78, calm: false, bigPools: false, plan: [[2, 10], [3, 10], [4, 10]] },
    { name: '1 分钟 · 速通', sec: 60,  blocking: false, intro: 0, s0: 10, s1: 18,
      pace: 1.00, calm: false, bigPools: true,  plan: [[1, 10], [2, 20], [3, 20], [4, 10]] },
    { name: '2 分钟 · 耐力', sec: 120, blocking: true,  intro: 0, s0: 10, s1: 18,
      pace: 1.00, calm: true,  bigPools: true,  plan: [[1, 15], [2, 35], [3, 35], [4, 35]] },
  ];

  // ---- difficulty ----
  // It never touches the clock: the three distances stay 30 / 60 / 120 s. What it
  // moves is the spacing, the speed ramp (including the opening speed) and how
  // often the nasty things turn up — hotels, horses, flyers, ruins, the armoured
  // car, the searchlight craft, long crystal / stalagmite runs, huge lava lakes
  // and the new lava geyser.
  const DIFFS = [
    { name: '简单', note: '更慢 · 更疏 · 少高难', gapMul: 1.30, hardMul: 0.45 },
    { name: '正常', note: '标准节奏',             gapMul: 1.00, hardMul: 1.00 },
    { name: '挑战', note: '更快 · 更密 · 多高难', gapMul: 0.76, hardMul: 1.55 },
  ];
  let diffIndex = 1;
  let isMobile = false;                  // the phone build: two thumb buttons
  let paused = false;                    // the gear menu freezes the world

  // ---- the speed ramp (MPH), tuned per distance AND difficulty ----
  // Rows are 简单 / 正常 / 挑战; each row lists [30 s, 60 s, 120 s] as [start, end].
  // Absolute numbers, not offsets: every combination gets its own band.
  const SPEED_PLAN = [
    [[9.5, 15.0], [9.0, 14.0], [9.0, 13.5]],     // 简单
    [[11.0, 17.0], [10.0, 15.0], [10.0, 15.0]],  // 正常
    [[12.5, 19.0], [11.5, 18.0], [11.0, 17.0]],  // 挑战
  ];

  // The phone fog eats into the warning distance, so the whole world runs a
  // fraction slower to buy it back. One factor, applied where the band is read
  // (speedRange) AND where the target is derived — targetScore is the inverse
  // integral of that same band, so scaling both keeps every run its nominal
  // length; scaling only one would stretch the clock.
  const SPEED_SCALE = 0.96;

  MODES.forEach((m, i) => {
    m.target = targetScore(m.sec, SPEED_PLAN[1][i][0] * SPEED_SCALE,
                                    SPEED_PLAN[1][i][1] * SPEED_SCALE);  // 正常
    m.track = Math.round(m.target * PX_PER_SCORE);   // px of track to cover
    m.total = m.plan.reduce((s, seg) => s + seg[1], 0);
  });
  // the ramp this run is on
  function speedRange() {
    // both builds run the same band: the phone version differs only in its
    // controls, never in speed
    const [s0, s1] = SPEED_PLAN[diffIndex][modeIndex];
    return { s0: s0 * SPEED_SCALE, s1: s1 * SPEED_SCALE };
  }
  function hardMul() { return DIFFS[diffIndex].hardMul; }
  // how often a "hard" kind is allowed to crowd in
  function hardP(p) { return Math.max(0, Math.min(0.9, p * hardMul())); }
  function gapMul() { return DIFFS[diffIndex].gapMul; }

  // which stage a run should be in after `sec` seconds of play
  // A short mode's stage change is held back until no obstacle has spawned for a
  // full second, so the new stage's banner never lands on the heels of the last
  // obstacle from the previous stage. (The long mode already clears the screen,
  // so it does not need this.)
  const STAGE_GAP_FRAMES = 60;

  function stageAt(sec) {
    const plan = MODES[modeIndex].plan;
    let t = 0;
    for (const seg of plan) {
      t += seg[1];
      if (sec < t) return seg[0];
    }
    return plan[plan.length - 1][0];
  }
  // ---- ending ----
  // Where the runner stands. On the phone the clock panel and the dial sit in
  // the top-left corner and the left thumb rests over them, so the runner is
  // moved right until his tail clears the clock's box — the strip of road to
  // his left is simply empty, nothing is painted in to fill it.
  // 254 clears the panel (its right edge sits at (14 + 134) * K = 222) with a
  // little air to spare.
  const PHONE_START_X = 254;
  function heroStartX() { return isMobile ? PHONE_START_X : 60; }
  const END_STOP_X = 352;        // where he first stops, in front of the crowd
  const END_WALK = 84;           // frames spent walking over to them
  const END_WAIT = 120;          // then he waits 2 seconds in front of them
  const END_ADV_X = 620;         // and walks on, into the middle of the group
  const END_ADV = 150;           // frames for that second walk
  const END_CROWD_X = 424;       // where the crowd starts
  const CEIL_GAP = 330;          // stage 4: ceiling height above the ground line
  const FALL_DEPTH = 560;        // how far below the surface road the cave floor sits
  const EARTH_H = 200;           // thickness of the soil slab under the surface road
  const DROP_G = 0.42;           // gravity while the camera follows the dino down
  // ---- ceiling lava (lavaflow) ----
  // It is never frozen to let the dino under — the column keeps streaming down
  // for as long as it is on screen. Instead of a length cap, its growth is set
  // up so it simply cannot reach him. On the first frame we see it we measure
  // the road left between it and the dino and derive a per-px-of-road growth
  // from that, so the amount it has lengthened by the time it arrives is the
  // SAME no matter how far the spacing rules shoved it out to the right first.
  // It therefore arrives with a fixed, known length: always clear of a standing
  // dino's head at every speed, and never stopping mid-flow.
  const FLOW_LEN0 = 16;          // length at the instant it appears
  const FLOW_GROW_ADD = 200;     // px it may lengthen over the whole crossing
                                 //  (16 + 200 = 216 max -> tip 114px above the
                                 //   road, ~67px over a 47-tall dino's head)
  // A stalactite can never grow, so it only needs the same headroom as a one-off
  // clamp at the moment it is made.
  const CEIL_SAFE_LEN = 250;
  // Every geyser column is one height: a ONE-jump obstacle. A single jump tops
  // out near 107px in the cave, so a 70px column clears with ~35px to spare on
  // a well-timed jump — it still has to be jumped, it just no longer costs the
  // double.
  const GEYSER_TOP = 70;
  // ---- the floor's height ceiling (stage 4) ----
  // Nothing standing on the cave floor may be taller than the geyser's column.
  // The geyser is the cave's own measuring stick: one jump, 70px to the crown.
  // Past that the piece stops reading as "jump me" and starts reading as
  // furniture — and a slim 100px stalagmite in particular looked like a
  // stalactite growing up out of the floor, i.e. a bug rather than a design.
  // So every floor piece is generated at or under FLOOR_H_MAX.
  const FLOOR_H_MAX = GEYSER_TOP - 2;            // 68 — level with the column, never over
  // ---- 地形抬升 ----
  // One floor slot buys a stretch of road that is shoved bodily upwards: he runs
  // up the slope, crosses the raised plane and runs back down, and for those few
  // seconds the road he stands on is simply higher. There is never a second
  // layer — the terrain comes up once, and a new lift may not start until the
  // old one is gone.
  // 36, not 54. The plateau has to carry real hazards, and a hazard standing on
  // it is measured from the ORIGINAL road — so every pixel the lift takes is a
  // pixel the hazard cannot have. At 54 the pieces on top could only be 14 tall
  // (a pebble nobody can read); at 36 they get 32, which is a jump you can see.
  const LIFT_H = 36;             // how far the road comes up
  const LIFT_RAMP = 132;         // the slope at each end — walked, never jumped
  const LIFT_CLEAR = 190;        // air the roof must leave above a raised floor
  const CRYSTAL_COLS = ['#e04a52', '#f0c33c', '#3f8fe6', '#4fb968', '#a259e0']; // red / yellow / blue / green / purple
  // A jump keeps the dino off the ground for about 34 frames. Without a double
  // jump there is nothing to do but wait that out, so the next hazard has to be
  // further away than a whole jump — otherwise you clear one thing and land on
  // the next with no way to avoid it. With a double jump the player can chain
  // and the gap may be tighter. This is the number behind every spacing floor.
  const AIR_CHAINED = 26;        // frames of road, when a double jump is available
  const AIR_GROUNDED = 44;       // ...and when it is not (stage 1 only):
                                 //     34 frames of flight, plus 10 to react
  // A hazard you can only survive from the ground — the airship's beam, the jet's
  // altitude, anything hanging from the ceiling — and you must not still be
  // coming down from the last jump when it arrives.
  const FLOORED = { airship: true, jet: true, stalactite: true, lavaflow: true };
  function airFrames() {
    return abilityStage >= 2 ? AIR_CHAINED : AIR_GROUNDED;
  }
  // After a blown geyser or a lava pool the dino is off the ground the longest
  // of anything in the cave, so the road behind those two is stretched — the
  // whole trailing gap, not just its floor (see the spawn spacing block).
  const REAR_GAP_MUL = 1.5;

  // ==========================================================================
  //  SPACING IS MEASURED IN TIME
  // --------------------------------------------------------------------------
  //  Every gap between obstacles is a number of FRAMES, so it is the same
  //  stretch of TIME at any speed. The base numbers were tuned at REF_SPEED and
  //  TIME_CAL rescales them so 正常 · 1 分钟 — the reference mode — keeps the
  //  overall density it always had. Past that only the mode's pace and the
  //  difficulty's gapMul move the numbers; speed does not, which is what stops
  //  a fast run from pinching the design into something unreadable.
  const TIME_CAL = 0.80;
  // A "heavy" obstacle: a two-storey building, a lava geyser, a stalactite, a gem
  // run. Consecutive heavy spawns are capped by difficulty (HEAVY_RUN_MAX): the
  // design must never read as one endless wall of them.
  const HEAVY = { hotel: true, geyser: true, stalactite: true, crystal: true };
  const HEAVY_RUN_MAX = [1, 2, 3];              // 简单 / 正常 / 挑战
  // A two-storey building or a geyser keeps a STRICT trailing gap, in frames —
  // the gap is drawn inside this range, so it is never a squeeze on landing and
  // never long enough for the run to go slack.
  const REAR_STRICT_LO = 115;                   // ~1.9 s
  const REAR_STRICT_HI = 180;                   // ~3.0 s
  // ...a stalactite or a gem run is treated more loosely: a floor only
  const REAR_LOOSE = 55;                        // ~0.9 s
  // The old px floors, kept as frames by dividing at REF_SPEED.
  const BASE_MIN_F    = 280 / REF_SPEED;        // the ordinary minimum
  const CEIL_MIN_F    = 320 / REF_SPEED;        // after anything on the ceiling
  const BIG_MIN_F     = 380 / REF_SPEED;        // after anything tall / wide
  const GROUND_MIN_F  = 460 / REF_SPEED;        // after a hazard met from the air
  const HALF_SCREEN_F = (W / 2) / REF_SPEED;    // the run-up before a big one
  const REAR_POOL_F   = 200 / REF_SPEED;        // road kept behind a lava pool
  const MOVER_LEAD_F  = 300 / REF_SPEED;        // extra lead a mover needs
  const OBSTACLES_ON = true;     // obstacles enabled
  const INVINCIBLE = false;      // deaths are ON (set true for a cannot-die preview)
  const MOUNTAIN_SPEED = 0.8;    // front mountain parallax
  const FAR_SPEED = 0.35;        // far background parallax (slower)
  const JUMP_V = -13.5;          // jump impulse
  let H = BASE_H;                // current canvas height (mutable)
  let GROUND_Y = H - GROUND_GAP; // current ground line (mutable)
  canvas.width = W;
  canvas.height = H;

  // ---- Game state ----
  let state, dino, obstacles, clouds, mountains, mountainSpan, farMountains, farSpan,
      score, speed, groundOffset, spawnTimer, ceilTimer, frame,
      stage, pendingStage, phase, spawnPause, banner, downHeld, farAlpha, skyDark, skyTarget,
      night, forceCar, caveAlpha, gap, camY, edgeX, dropY0, endT, crowd,
      modeIndex = 1, elapsed = 0, winScore = MODES[1].target, menuIndex = 1,
      targetH, finishing = false, introT = 0, preT = 0, menuRow = 1,
      abilityStage, pendingAbility, heavyRun = 0, framesSinceSpawn = 0,
      bestByMode = MODES.map(() => 0);

  // Personal bests, one per distance, kept locally. Not required for play.
  const BEST_KEY = 'dinoRun.best.v1';
  try {
    const raw = JSON.parse(localStorage.getItem(BEST_KEY) || 'null');
    if (Array.isArray(raw)) bestByMode = MODES.map((m, i) => Math.max(0, Math.floor(raw[i]) || 0));
  } catch (e) { /* no storage, no records — the game plays fine */ }
  function saveBest() {
    const i = modeIndex, v = Math.floor(score);
    if (v > bestByMode[i]) {
      bestByMode[i] = v;
      try { localStorage.setItem(BEST_KEY, JSON.stringify(bestByMode)); } catch (e) {}
    }
  }

  function reset() {
    state = 'ready'; // menu | ready | playing | over
    document.body.classList.remove('running');
    // the run opens in whatever stage the mode's schedule starts with
    stage = MODES[modeIndex].plan[0][0];
    abilityStage = stage;                  // what the dino can do right now
    pendingAbility = null;                 // ...and what it is waiting to become
    H = stagePlateH(stage);                // stage 1 is the short screen
    targetH = H;
    GROUND_Y = H - GROUND_GAP;
    canvas.height = H;
    const r0 = speedRange();
    winScore = targetScore(MODES[modeIndex].sec, r0.s0, r0.s1);   // this run's line
    elapsed = 0;                           // steps run so far (the timer)
    finishing = false;
    introT = 0;                            // armed by startGame()
    // The 30 s lead-in is the ONLY thing that ever sets preT. Clearing it here
    // is what makes "start 30 s, quit during the wait, pick 1 min" safe: without
    // this the leftover wait keeps running under the 1 min run and drags it into
    // stage 2 (the screen grows and a whole stage is skipped).
    preT = 0;
    toastT = 0; toastStage = 0;            // ...and no card is left over
    speed = r0.s0;
    forceCar = false;
    pendingStage = null;
    phase = null;
    spawnPause = 0;
    banner = 0;
    farAlpha = (stage >= 2) ? 1 : 0;       // the far range belongs to stage 2+
    caveAlpha = (stage >= 4) ? 1 : 0;
    gap = null;
    camY = 0;
    edgeX = 0;
    dropY0 = GROUND_Y;
    endT = 0;
    crowd = [];
    skyDark = 0;
    skyTarget = 0;
    night = 0;
    downHeld = false;
    dino = { x: heroStartX(), y: GROUND_Y, w: 44, h: 47, vy: 0, onGround: true, duck: false, jumps: 0, gliding: false };
    obstacles = [];
    clouds = [];
    mountains = [];
    groundOffset = 0;
    score = 0;
    spawnTimer = 0;
    ceilTimer = 70;            // the roof has its own clock (stage 4)
    frame = 0;
    heavyRun = 0;                          // no heavy obstacle is "in a row" yet
    framesSinceSpawn = STAGE_GAP_FRAMES;   // the road starts clear
    for (let i = 0; i < 4; i++) {
      clouds.push({ x: Math.random() * W, y: 30 + Math.random() * 70, s: 0.4 + Math.random() * 0.4 });
    }
    // front range (pale) — fixed size, drawn off GROUND_Y so it slides down
    // with the ground instead of stretching when the stage grows
    let mx = -60;
    const startX = mx;
    while (mx < W + 120) {
      const w = 150 + Math.random() * 130;
      const h = 80 + Math.random() * 70;
      const flat = Math.random() < 0.4;            // some flat-topped
      const topW = 0.12 + Math.random() * 0.16;
      mountains.push({ x: mx, w, h, flat, topW });
      mx += w * 0.62;
    }
    mountainSpan = mx - startX;
    // far range — pale brown, taller, slower; only shown from stage 2
    farMountains = [];
    let fx = -90;
    const fStart = fx;
    while (fx < W + 170) {
      const w = 200 + Math.random() * 170;
      const h = 190 + Math.random() * 130;
      const flat = Math.random() < 0.4;
      const topW = 0.12 + Math.random() * 0.16;
      const lava = !flat && Math.random() < 0.4;   // sharp volcanic peaks
      farMountains.push({ x: fx, w, h, flat, topW, lava });
      fx += w * 0.60;
    }
    farSpan = fx - fStart;
  }

  // foreground colour: as the sky darkens, lighten colours toward white so the
  // HUD stays readable once the stage-3 sky turns black
  function fg(hex) {
    if (night < 0.02) return hex;
    const n = parseInt(hex.slice(1), 16);
    const t = night * 0.85;
    const r = Math.round(((n >> 16) & 255) + (245 - ((n >> 16) & 255)) * t);
    const g = Math.round(((n >> 8) & 255) + (245 - ((n >> 8) & 255)) * t);
    const b = Math.round((n & 255) + (245 - (n & 255)) * t);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  // background colours: dim proportionally as the sky darkens, keeping each
  // element's hue so mountains / road stay distinguishable from one another
  function dim(hex) {
    if (skyDark < 0.02) return hex;
    const n = parseInt(hex.slice(1), 16);
    const f = 1 - skyDark * 0.62;   // darkest ~38%: dimmed but hues stay apart
    return 'rgb(' + Math.round(((n >> 16) & 255) * f) + ',' +
                    Math.round(((n >> 8) & 255) * f) + ',' +
                    Math.round((n & 255) * f) + ')';
  }

  // ---- Input ----
  // ---- time-select menu ----
  // The layout is derived from the canvas height so it re-centres itself, and
  // both the drawing and the click hit-test read from the same list.
  // The select screen now sits on the short 800x240 stage-1 plate (see
  // openMenu), so the cards are compact enough for two rows plus a title.
  const CARD_H = 58, CARD_GAP = 24, ROW_GAP = 16;
  // three cards have to fit the plate, whatever its width is (a phone's is 640)
  function cardW() { return Math.min(196, Math.floor((W - 28 - 2 * CARD_GAP) / 3)); }
  // Six cards on one screen: three difficulties on the top row, three distances
  // on the bottom. Drawing and hit-testing read the same list, so a click can
  // never disagree with what is on screen.
  function menuMetrics() {
    // title + both rows are one block, centred in the 240px stage-1 screen
    const rowsH = 2 * CARD_H + ROW_GAP;
    const blockH = 40 + rowsH;
    const top0 = Math.round((H - blockH) / 2) + 4;
    const titleY = top0 + 14;
    const subY = titleY + 18;
    const hintY = H - 12;
    const rowsW = 3 * cardW() + 2 * CARD_GAP;
    // nudged right so the running dino keeps the left of the road to himself —
    // only where there is room for the nudge
    const x0 = Math.max(8, Math.min(W - rowsW - 8,
                                    Math.round((W - rowsW) / 2) + (isMobile ? 0 : 56)));
    const top = top0 + 40;
    return { titleY, subY, hintY, x0, top, rowsW };
  }
  function menuLayout() {
    const m = menuMetrics();
    const out = [];
    for (let row = 0; row < 2; row++) {
      for (let i = 0; i < 3; i++) {
        out.push({
          row, i,
          x: m.x0 + i * (cardW() + CARD_GAP),
          y: m.top + row * (CARD_H + ROW_GAP),
          w: cardW(), h: CARD_H
        });
      }
    }
    return out;
  }
  function menuHit(px, py) {
    for (const r of menuLayout()) {
      if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return r;
    }
    return null;
  }

  function drawCard(r, sel) {
    ctx.fillStyle = sel ? '#ffffff' : 'rgba(255,255,255,0.62)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.lineWidth = sel ? 2 : 1;
    ctx.strokeStyle = sel ? '#185fa5' : '#cccac2';
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
    if (sel) { ctx.fillStyle = '#185fa5'; ctx.fillRect(r.x, r.y, 5, r.h); }
  }

  // difficulty colours (green / amber / red) and the card tint behind each one
  const DIFF_TINT = [
    { ink: '#2f8f57', bg: '#e9f6ee', soft: '#f3f9f5' },
    { ink: '#b4771a', bg: '#fdf3e1', soft: '#fcf7ee' },
    { ink: '#b23b2c', bg: '#fbe9e6', soft: '#fbf2f0' },
  ];
  // duration: longer run, deeper card, so the row reads as a scale
  const TIME_TINT = ['#fbfbf9', '#e6e4dd', '#c9c6bd'];
  function timeLabel(sec) { return sec >= 60 ? (sec / 60) + ' 分钟' : sec + ' 秒'; }

  // a card tint at a given alpha, so the running scene reads through the panel
  function tint(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  function drawMenu() {
    // The panel is deliberately see-through: the stage-1 run behind it is the
    // backdrop, not a wall. 50% wash + 82% cards keeps the words readable.
    ctx.fillStyle = 'rgba(240,238,232,0.50)';
    ctx.fillRect(0, 0, W, H);
    const met = menuMetrics();

    ctx.textAlign = 'center';
    ctx.fillStyle = '#2c2c2a';
    ctx.font = '600 20px "Courier New", monospace';
    ctx.fillText('选择难度与时间', met.x0 + met.rowsW / 2, met.titleY);   // over the cards, not the canvas

    // Six cards, one word each: the difficulty in its own colour on top, the
    // clock underneath with the longer runs progressively deeper.
    for (const r of menuLayout()) {
      const sel = (r.row === 0) ? r.i === diffIndex : r.i === menuIndex;
      let fill, ink, edge;
      if (r.row === 0) {
        const c = DIFF_TINT[r.i];
        fill = sel ? c.bg : c.soft;
        ink = c.ink;
        edge = sel ? c.ink : '#dcd8d0';
      } else {
        fill = TIME_TINT[r.i];
        ink = '#2c2c2a';
        edge = sel ? '#535353' : '#d4d0c7';
      }
      ctx.fillStyle = tint(fill, 0.72);
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.lineWidth = sel ? 2.5 : 1;
      ctx.strokeStyle = edge;
      ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
      if (sel) {
        ctx.fillStyle = (r.row === 0) ? ink : '#535353';
        ctx.fillRect(r.x, r.y, 6, r.h);
      }
      ctx.textAlign = 'center';
      ctx.fillStyle = ink;
      ctx.font = '600 21px "Courier New", monospace';
      ctx.fillText(r.row === 0 ? DIFFS[r.i].name : timeLabel(MODES[r.i].sec),
                   r.x + r.w / 2, r.y + r.h / 2 + 7);
    }
    ctx.textAlign = 'left';
  }


  // pick a mode and set the run up for it
  function chooseMode(i) {
    menuIndex = i;
    modeIndex = i;
    beginRun();
  }

  // Picking a distance IS the start. There is no "press space" card any more:
  // 1 min and 2 min open on the short stage-1 screen and only the stage sign
  // announces it, exactly the way the later stage changes do it.
  // The phone never grows its plate. On a desktop a stage change opens the
  // frame from 240 to 480 and the far mountains come with it; on a phone that
  // doubling read as the whole screen jumping, so the frame is BIG_H from the
  // first frame to the last and the mountains are simply cut off at its edge —
  // which is all a border does. The world is exactly the same size either way.
  // The phone is one frame for the whole run (no growth at a stage change) and
  // that frame is the landscape plate, not the desktop's 480.
  function stagePlateH(s) { return isMobile ? MOBILE_H : (s >= 2 ? BIG_H : BASE_H); }

  function beginRun() {
    reset();
    document.body.classList.add('running');   // reset() cleared it; a run sets it again
    introT = 0;
    preT = 0;                      // a run starts with no lead-in by default;
                                   // only the 30 s branch below re-arms it
    if (modeIndex === 0 && !STAGE4_ONLY) {
      // 30 s lives in stage 2, but it opens on the stage-1 plate so the growth
      // is something the player SEES: "等待。。。" holds while the screen opens,
      // and the stage-2 sign lands the moment the wait is over (see update).
      stage = 1; abilityStage = 1; pendingStage = null;
      H = stagePlateH(1); targetH = H; GROUND_Y = H - GROUND_GAP; canvas.height = H;
      skyDark = 0; skyTarget = 0; farAlpha = 0; caveAlpha = 0; night = 0;
      dino.y = GROUND_Y; dino.vy = 0; dino.onGround = true; dino.duck = false;
      state = 'playing';
      preT = 66;
      return;
    }
    state = 'playing';
    banner = 120;                  // the opening sign, same as any stage start
    spawnTimer = 40;               // ...and the first hazard waits for it
  }

  function openMenu() {
    reset();
    state = 'menu';
    // The select screen is the stage-1 plate: desert, short screen, dino on the
    // ground. That is also what makes the 30 s start read as the screen opening.
    // The all-cave build has no stage 1 to show, so it keeps its own plate.
    if (!STAGE4_ONLY) {
      stage = 1; abilityStage = 1; pendingStage = null;
      H = stagePlateH(1); targetH = H; GROUND_Y = H - GROUND_GAP; canvas.height = H;
      skyDark = 0; skyTarget = 0; farAlpha = 0; caveAlpha = 0; night = 0;
      clouds.forEach(c => { if (c.y > 86) c.y = 26 + Math.random() * 50; });
    }
    obstacles.length = 0;
    dino.y = GROUND_Y; dino.vy = 0; dino.onGround = true; dino.duck = false;
  }

  // The menu and the 30 s lead-in both need a world that is running without a
  // run: road rolling, clouds and both mountain layers drifting, legs going.
  // Nothing spawns and the clock never moves.
  function driftWorld(px) {
    frame++;
    groundOffset += px;
    clouds.forEach(c => { c.x -= c.s; if (c.x < -60) { c.x = W + 20; c.y = 26 + Math.random() * 50; } });
    mountains.forEach(m => { m.x -= MOUNTAIN_SPEED; if (m.x + m.w < -20) m.x += mountainSpan; });
    farMountains.forEach(m => { m.x -= FAR_SPEED; if (m.x + m.w < -20) m.x += farSpan; });
  }

  // ---- stage changes ----
  // Apply a new stage. `blocking` is true when the change is allowed to take
  // over the world (the long mode): the spawns hold, the classic banner plays
  // and the cave cut-scene gets its full run. When it is false the change just
  // happens underneath a moving run — the height eases over, the sign pops up,
  // and the obstacles never stop coming.
  function enterStage(s, blocking) {
    stage = s;
    // the card belongs to the change itself, so it is raised here rather than
    // waiting for the sign to finish
    if (TOASTS[s]) { toastStage = s; toastT = TOAST_LIFE; }
    // IMPORTANT: the new stage's hazards start coming immediately, but the
    // dino's abilities are NOT switched yet. They wait until the last hazard
    // from the previous stage has left the screen (see the update loop), so you
    // never lose the double jump while a stage-2 hotel is still in front of you.
    if (s !== abilityStage) pendingAbility = s;
    targetH = stagePlateH(s);             // desktop: the screen grows / shrinks
    if (s === 3) skyTarget = 1;           // night falls
    if (s === 4) {
      // The road ahead caves in. Whatever is already on the road stays there and
      // shares the screen with the breach — it scrolls away on its own during
      // the cut-scene instead of vanishing the moment the ground breaks open.
      // (The sweep happens on touchdown, where the whole scene changes anyway.)
      skyTarget = 0;                      // dawn breaks as the road gives way
      gap = { x: W - 70, w: 3000 };
      phase = 'gap';
      ceilTimer = 90;                     // first roof a beat after the landing
      return;
    }
    banner = 120;
    // Every stage change opens the banner window, blocking or not. Collisions
    // stay LIVE through it (see collisionOff) — the banner only changes what
    // happens to the spawning: a blocking mode holds it, a short mode keeps the
    // hazards coming (see spawningPaused). Either way the clock runs, so the
    // transition is paid for out of the stage being entered.
    phase = 'banner';
    if (blocking) { spawnTimer = 45; spawnPause = 60; }
  }

  // Hazards are live through a stage change: an obstacle you can see can kill
  // you, whether the level is changing or not. Only the two windows where the
  // dino is out of the world altogether suspend them — the drop down into the
  // cave, where the surface scrolls away behind the camera, and the walk-off
  // ending, which is played with the road swept clean.
  function collisionOff() { return phase === 'drop' || phase === 'ending'; }

  // Spawning is held only while the dino has no control — the road caving in,
  // the drop, the ending, or a blocking mode playing a stage change out. A
  // banner on its own is just a sign: it never stops the spawns.
  function spawningPaused() {
    if (phase === 'gap' || phase === 'drop' || phase === 'ending' || phase === 'waiting') return true;
    if (phase === 'banner' && MODES[modeIndex].blocking) return true;
    // a short mode's stage change is due but its clear second has not passed yet
    if (phase === null && CAVE_ONLY && !MODES[modeIndex].blocking &&
        stageAt(elapsed / 60) !== stage) return true;
    return false;
  }

  function jump() {
    if (paused) return;                       // the gear menu holds the world still
    if (state === 'ready') startGame();
    if (introT > 0) return;                   // the prep card holds the world
    if (preT > 0) return;                     // ...and so does the 30 s lead-in:
                                              // no input, or the dino hangs in
                                              // mid-air until the wait is over
    if (phase === 'drop') return;             // the camera owns the drop-in
    if (phase === 'ending') return;           // the ending owns the dino
    if (state !== 'playing' || dino.duck) return;
    const canDouble = abilityStage >= 2;   // stage 2 onward, the chase included
    if (dino.onGround) {
      // first jump
      dino.vy = JUMP_V;
      dino.onGround = false;
      dino.jumps = 1;
    } else if (canDouble && dino.jumps === 0) {
      // he left the road WITHOUT jumping (walked off a ledge, dropped into a
      // rupture, came down the far slope before the fix above existed). That is
      // not a jump he spent, so charge it as the FIRST one and keep the double
      // jump for later. Stage 1 has no second jump at all, so it keeps the old
      // rule: once off the ground, no rescue.
      dino.vy = JUMP_V;
      dino.jumps = 1;
    } else if (canDouble && dino.jumps < 2) {
      // stages 2, 3 and 4: one extra jump in mid-air (double jump)
      dino.vy = JUMP_V * 0.92;
      dino.jumps = 2;
    }
  }
  function startGame() {
    state = 'playing';
    document.body.classList.add('running');   // the phone discs step aside
    // the prep card: the world is held still for this long, clock stopped
    introT = Math.round((MODES[modeIndex].intro || 0) * 60);
  }

  window.addEventListener('keydown', (e) => {
    // while a menu or a help page is open it owns the keyboard
    if (!panel.classList.contains('hidden') || !help.classList.contains('hidden')) {
      if (e.code === 'Escape') closeOverlays();
      return;
    }
    // ---- the time-select menu owns the keyboard while it is up ----
    if (state === 'menu') {
      if (e.code === 'ArrowUp') menuRow = 0;
      else if (e.code === 'ArrowDown') menuRow = 1;
      else if (e.code === 'ArrowLeft') {
        if (menuRow === 0) diffIndex = (diffIndex + DIFFS.length - 1) % DIFFS.length;
        else menuIndex = (menuIndex + MODES.length - 1) % MODES.length;
      } else if (e.code === 'ArrowRight') {
        if (menuRow === 0) diffIndex = (diffIndex + 1) % DIFFS.length;
        else menuIndex = (menuIndex + 1) % MODES.length;
      }
      else if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); chooseMode(menuIndex); }
      return;
    }
    // M / Esc anywhere: back to the time select
    if (e.key === 'm' || e.key === 'M' || e.code === 'Escape') { openMenu(); return; }
    // R restarts the same distance at any time (mid-game or after game over)
    if (e.key === 'r' || e.key === 'R') { beginRun(); return; }
    // game over: any key restarts the same distance
    if (state === 'over') { beginRun(); return; }
    if (e.code === 'ArrowDown') { downHeld = true; }
    else if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
    // other keys during play are ignored
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowDown') downHeld = false;
  });
  // touch / click: pick a mode in the menu, jump in game, restart when over
  function canvasTap(e) {
    if (state === 'menu') {
      const r = canvas.getBoundingClientRect();
      const x = (e.clientX - r.left) * (W / r.width);
      const y = (e.clientY - r.top) * (H / r.height);
      const hit = menuHit(x, y);
      if (hit) {
        if (hit.row === 0) { diffIndex = hit.i; menuRow = 0; }   // pick a difficulty
        else { menuRow = 1; chooseMode(hit.i); }                 // pick a distance: go
      }
      return;
    }
    if (state === 'over') { beginRun(); return; }
    jump();
  }
  canvas.addEventListener('pointerdown', canvasTap);

  // ---- Obstacles ----
  // Ground obstacles store o.y = ground contact line.
  // Flying obstacles store o.y = vertical CENTER and set fly:true.
  // o.v selects a visual variant (same behaviour, different look / size).
  // Weighted pick. Entries are [weight, kind, hard?]. A hard kind's weight is
  // scaled by the difficulty (hardMul), so 简单 thins the nasty ones out and
  // 挑战 crowds them in — without ever changing what can appear, only how often.
  function pickKind(entries) {
    // When the heavy-run cap is already reached the heavy kinds are dropped from
    // the draw entirely, so the next spawn is forced to be a light one. 简单 may
    // never show two heavies in a row, 正常 two, 挑战 three (see HEAVY_RUN_MAX).
    if (heavyRun >= HEAVY_RUN_MAX[diffIndex]) {
      const light = entries.filter(e => !HEAVY[e[1]]);
      if (light.length) entries = light;
    }
    let total = 0;
    for (const e of entries) total += e[0] * (e[2] ? hardMul() : 1);
    let r = Math.random() * total;
    for (const e of entries) {
      r -= e[0] * (e[2] ? hardMul() : 1);
      if (r <= 0) return e[1];
    }
    return entries[entries.length - 1][1];
  }

  // ==========================================================================
  //  地形抬升 — the height of the road, as a function of x
  // --------------------------------------------------------------------------
  //  Nothing global moves: GROUND_Y is still the flat road. The raised stretch
  //  is an obstacle like any other, so it scrolls at exactly the road's speed,
  //  and the height under any x can be read back at any time. Every piece that
  //  stands on the road asks this function rather than GROUND_Y, which is what
  //  keeps him from running through a crystal that is standing on a hill.
  // ==========================================================================
  function liftAt(x) {
    let d = 0;
    for (const o of obstacles) {
      if (o.type !== 'uplift') continue;
      const L = o.x, R = o.x + o.w;
      if (x <= L || x >= R) continue;
      // a ramp at each end, so there is nothing to jump and nothing to fall into
      const k = Math.min(1, Math.min(x - L, R - x) / o.ramp);
      if (o.h * k > d) d = o.h * k;
    }
    return d;
  }
  function floorYAt(x) { return GROUND_Y - liftAt(x); }

  // how much the road has come up under the span [a,b] — the roof uses this to
  // decide whether it has to get out of the way
  function liftOverlap(a, b) {
    for (const o of obstacles) {
      if (o.type !== 'uplift') continue;
      if (b > o.x && a < o.x + o.w) return o.h;
    }
    return 0;
  }

  // The roof is rock and does not move, so when the floor comes up to meet it
  // everything hanging from it retracts by the same amount. LIFT_CLEAR of air is
  // left above the new road — more than a full jump — so the squeeze reads as
  // drama without ever costing a life.
  function liftRoofPiece(o, u) {
    if (!o || !o.ceil || !(u > 0)) return;
    const cap = Math.max(26, CEIL_GAP - LIFT_CLEAR - u);
    if (o.type === 'lavaflow') {
      // it grows as it crosses, so it is the GROWTH that has to stop short
      const g = o.grow == null ? FLOW_GROW_ADD : o.grow;
      o.grow = Math.min(g, Math.max(0, cap - FLOW_LEN0));
      if (o.x0 != null) o.rate = o.grow / Math.max(1, o.x0);
      o.len = Math.min(o.len || FLOW_LEN0, FLOW_LEN0 + o.grow);
    } else {
      o.len = Math.min(o.len, cap);
    }
    o.lift = u;
    o.low = false;                 // nothing up there is a "do not jump" sign now
  }
  function retractRoof(a, b) {
    for (const o of obstacles) {
      if (!o.ceil) continue;
      if (o.x + (o.w || 0) < a || o.x > b) continue;
      liftRoofPiece(o, LIFT_H);
    }
  }

  function spawnObstacle() {
    const v = () => Math.floor(Math.random() * 3);

    if (stage < 2) {
      // ---- stage 1 — like the original Chrome dino: cacti + one flyer ----
      const kind = pickKind([
        [1.00, 'cactusS'], [0.73, 'cactusB'], [0.80, 'cactusC'], [0.80, 'bird', true],
      ]);
      if (kind === 'cactusS') {
        obstacles.push({ type: 'cactus', x: W + 20, y: GROUND_Y, w: 20, h: 34, v: 0 });   // small single
      } else if (kind === 'cactusB') {
        obstacles.push({ type: 'cactus', x: W + 20, y: GROUND_Y, w: 28, h: 48, v: 1 });   // big single
      } else if (kind === 'cactusC') {
        obstacles.push({ type: 'cactus', x: W + 20, y: GROUND_Y, w: 46, h: 38, v: 2 });   // cluster
      } else {
        const cy = Math.random() < 0.5 ? GROUND_Y - 18 : GROUND_Y - 46;
        obstacles.push({ type: 'bird', fly: true, x: W + 20, y: cy, w: 42, h: 28, wing: 0, extra: 0, v: v() });
      }
    } else if (stage === 2) {
      // ---- stage 2: big western hazards ----
      const kind = pickKind([
        [1.00, 'cactus'], [0.87, 'ruin', true], [1.00, 'hill'],
        [0.93, 'hotel', true], [1.13, 'horse', true], [1.73, 'eagle', true],
      ]);
      if (kind === 'cactus') {
        const w = 30 + Math.random() * 14, h = 60 + Math.random() * 20;
        obstacles.push({ type: 'cactus', x: W + 24, y: GROUND_Y, w, h, v: v() });
      } else if (kind === 'ruin') {
        const rv = v();
        const w = rv === 1 ? 32 + Math.random() * 14 : 58 + Math.random() * 32;
        const h = rv === 1 ? 72 + Math.random() * 22 : 48 + Math.random() * 22;
        obstacles.push({ type: 'ruin', x: W + 24, y: GROUND_Y, w, h, v: rv });
      } else if (kind === 'hill') {
        const w = 88 + Math.random() * 34, h = 50 + Math.random() * 18;
        obstacles.push({ type: 'hill', x: W + 30, y: GROUND_Y, w, h, v: v() });
      } else if (kind === 'hotel') {
        const hv = v();
        const w = hv === 1 ? 56 + Math.random() * 18 : 84 + Math.random() * 30;
        const h = 120 + Math.random() * 30;
        obstacles.push({ type: 'hotel', x: W + 30, y: GROUND_Y, w, h, v: hv });
      } else if (kind === 'horse') {
        const w = 58 + Math.random() * 16, h = 72 + Math.random() * 16;
        obstacles.push({ type: 'horse', x: W + 30, y: GROUND_Y, w, h, extra: 2.5, v: v() });
      } else {
        const cy = Math.random() < 0.5 ? GROUND_Y - 28 : GROUND_Y - 60;
        obstacles.push({ type: 'eagle', fly: true, x: W + 24, y: cy, w: 64, h: 36, wing: 0, extra: 2.5, v: v() });
      }
    } else if (stage === 3) {
      // ---- stage 3: night pursuit ----
      // An airship is always followed by an armoured car, so the player must
      // stop ducking and jump again — that breaks the crouch rhythm.
      if (forceCar) {
        forceCar = false;
        const w = 54 + Math.random() * 38, h = 38 + Math.random() * 26;
        obstacles.push({ type: 'car', x: W + 26, y: GROUND_Y, w, h, extra: 1.6, v: v() });
        return;
      }
      const kind = pickKind([
        [1.00, 'airship', true], [1.00, 'car', true], [0.94, 'jet'],
      ]);
      if (kind === 'airship') {
        // hovering craft, parked high — only its search beam can kill you
        obstacles.push({
          type: 'airship', fly: true, x: W + 30, y: GROUND_Y - 240,
          w: 68 + Math.random() * 20, h: 34, extra: 0, wing: 0, v: v()
        });
        forceCar = true;
      } else if (kind === 'car') {
        const w = 54 + Math.random() * 38, h = 38 + Math.random() * 26;
        obstacles.push({ type: 'car', x: W + 26, y: GROUND_Y, w, h, extra: 1.6, v: v() });
      } else {
        // jet — three lanes, and the lane is what the player has to read.
        // The old single lane sat at 70-100, which is almost exactly a single
        // jump's apex (JUMP_V 13.5 against g 0.8 tops out at 114), so the jet
        // could be hopped instead of ducked. The low pass now hangs at 105-125,
        // where the belly is under a standing dino's head and over a jumping
        // one's feet: the floor is the only answer, which is what "低空压制"
        // was always meant to mean. The other two lanes (20% / 10%) fly at
        // 160-190 and 215-250 — a chained double jump tops out around 210, so
        // up there even the second jump ends under the hull and the run has to
        // stay on the road. Seventy per cent still come in low.
        const lane = Math.random();
        const alt = lane < 0.70 ? 105 + Math.random() * 20      // the low pass
                  : lane < 0.90 ? 160 + Math.random() * 30      // overhead
                  :               215 + Math.random() * 35;     // high
        obstacles.push({
          type: 'jet', fly: true, x: W + 30, y: GROUND_Y - alt,
          w: 78, h: 30, extra: 3, wing: 0, v: v()
        });
      }
    } else {
      // ---- stage 4: the cave — FLOOR ONLY ----
      // The roof is not generated here any more. It has its own clock and its
      // own placement (see spawnCeilObstacle), so one call here is always
      // exactly one floor group, and the gap measured afterwards runs floor to
      // floor. That is what lets the cave floor run tight: a ceiling spawn can
      // no longer take a floor slot, a roof piece can no longer stretch the gap
      // behind it, and nothing on the roof is ever "attached" to a floor group.
      const baseX = W + 24;
      // the ground at the spawn point may still be up there from a lift that is
      // half way across — a rupture cannot open in terrain that is already raised
      const onLift = liftAt(baseX + 90) > 0.5;
      // 最多一层 still holds: what is checked is the TAIL of the last raised
      // stretch, not its existence. While that tail is still near the spawn
      // point the next one would run into it; once it is 120px of flat road
      // behind the spawn point (still off screen) the next climb may start.
      // The real separation is the buffer band below: a new group is pushed
      // clear of the slope's foot anyway, and a new lift is a group too.
      let liftTail = -1e9;
      for (const o of obstacles) {
        if (o.type === 'uplift' && o.x + o.w > liftTail) liftTail = o.x + o.w;
      }
      const canLift = liftTail < baseX - 180;
      const kinds = [
        [1.00, 'crystal'], [onLift ? 0 : 0.86, 'lava'],
        [0.86, 'stalag'], [1.15, 'geyser', true],
      ];
      // 地形抬升 takes a slot like anything else — but only when no other raised
      // stretch exists, because the terrain never stacks
      if (canLift) kinds.push([1.35, 'uplift']);
      const kind = pickKind(kinds);

      if (kind === 'crystal') {
        // crystals (5 colours), hopped over like a spike. They usually erupt in
        // a little field of 3-5 shards rather than one — mixed sizes AND mixed
        // colours, so it reads as a cluster instead of a wall. The whole run is
        // kept narrow enough (<= ~180px) that a single jump still clears it.
        // How often it is a field rather than one shard is a difficulty knob.
        const n = Math.random() < hardP(0.42) ? 1 : 3 + Math.floor(Math.random() * 3);
        if (n === 1) {
          obstacles.push({
            type: 'crystal', x: baseX, y: GROUND_Y,
            w: 26 + Math.random() * 20,
            h: 34 + Math.random() * (FLOOR_H_MAX - 34),   // 34-68, never over the geyser
            c: Math.floor(Math.random() * 5)
          });
        } else {
          let x = baseX;
          for (let i = 0; i < n; i++) {
            // kept inside a jump's air-time: the whole run stays under ~150px
            // wide and no shard tops the geyser column, so one well-timed jump
            // still clears the lot (sizes still vary a lot, just not beyond reach)
            const w = 14 + Math.random() * 20;      // 14-34, every one different
            const h = 26 + Math.random() * (FLOOR_H_MAX - 26);   // 26-68, short to tall
            obstacles.push({
              type: 'crystal', solo: true, x, y: GROUND_Y, w, h,
              c: Math.floor(Math.random() * 5)
            });
            x += w + 4 + Math.random() * 9;
          }
        }
      } else if (kind === 'lava') {
        // the floor itself has ruptured — the ground cracked and fell in, leaving
        // a crater with lava pooled at the bottom. Most of them are deliberately
        // huge: wider than a double jump can carry, so a glide is the only way
        // over. Widths are built from hang-time frames x the current scroll
        // speed, which keeps them equally brutal however fast the world runs:
        //   a single jump carries ~35 frames, a double jump ~54, a glide 110+
        // The long distances also get a handful of genuinely monstrous lakes.
        const brutal = Math.min(0.92, 0.82 * hardMul());
        const huge = MODES[modeIndex].bigPools && Math.random() < hardP(0.30);
        const roll = Math.random();
        const frames = huge ? 88 + Math.random() * 12                  // 88-100
                     : roll > brutal ? 38 + Math.random() * 10         // double jump
                     : 62 + Math.random() * 30;                        // glide or bust
        obstacles.push({
          type: 'lava', x: baseX, y: GROUND_Y, w: Math.min(huge ? 820 : 700, Math.round(speed * frames)), h: 0,
          // road line -> lava surface. Kept inside the visible band of floor
          // (stage 4 only has ~40px of it below the road line).
          depth: 26 + Math.random() * 8
        });
      } else if (kind === 'stalag') {
        // stalagmite rising from the floor — some are big now, and they often
        // push up in a little forest of three to five, mixed heights
        const n = Math.random() < hardP(0.42) ? 1 : 3 + Math.floor(Math.random() * 3);
        if (n === 1) {
          obstacles.push({
            type: 'stalagmite', x: baseX, y: GROUND_Y,
            w: 20 + Math.random() * 20,
            h: 28 + Math.random() * (FLOOR_H_MAX - 28)   // 28-68: no more 100px spires
          });
        } else {
          let x = baseX;
          for (let i = 0; i < n; i++) {
            // same envelope as the crystal field: mixed heights, but the forest
            // still fits inside one jump
            const w = 14 + Math.random() * 18;
            const h = 26 + Math.random() * (FLOOR_H_MAX - 26);   // 26-68, knee-high to tall
            obstacles.push({ type: 'stalagmite', x, y: GROUND_Y, w, h });
            x += w + 3 + Math.random() * 10;
          }
        }
      } else if (kind === 'uplift') {
        // ---- 地形抬升 ----
        // The floor is shoved up as a whole. Half the width is flat, the rest is
        // slope, so the crossing is one climb, one plateau, one drop — no jump,
        // no input needed, and nothing to learn. What it changes is the LAYOUT:
        // for as long as it lasts the road is somewhere else, and so is the roof
        // clearance he has to live with up there.
        //
        // IT IS TERRAIN, NOT A PROP. It used to be 564-844 wide — under a second
        // of road — so it read as one more thing to hop over. A lift is now a
        // real stretch of road: 1100-2000 of level ground on top, three to five
        // seconds on screen, long enough to hold a couple of hazards of its own.
        const flat = 1100 + Math.random() * 900;
        const lobe = {
          type: 'uplift', x: baseX, y: GROUND_Y,
          w: flat + LIFT_RAMP * 2, h: LIFT_H, ramp: LIFT_RAMP
        };
        obstacles.push(lobe);
        // ...and what stands ON it. This is the whole point of the lift: the
        // road changes level and the hazards come with it, so for a few seconds
        // the run is played from higher up. Every piece is placed well clear of
        // both crests (a slope cannot be jumped from) and far enough from its
        // neighbour for one full jump to land before the next one arrives.
        // Heights are measured from the ORIGINAL road: 20-32 plus the 36 lift
        // keeps the tip at 56-68, still under the geyser's 70.
        const nUp = flat > 1600 ? 2 : 1;
        const inner = flat - 2 * 240;                 // the two slope shelves
        for (let i = 0; i < nUp; i++) {
          const at = baseX + LIFT_RAMP + 240 +
                     inner * ((i + 0.5) / nUp + (Math.random() - 0.5) * 0.06);
          // a group, not a lone shard: two or three pieces side by side read as
          // an obstacle from across the screen, where a single 30px cone just
          // looks like scenery. The whole group is still one jump wide.
          const nShard = 2 + Math.floor(Math.random() * 2);
          const stone = Math.random() < 0.45;
          const c = Math.floor(Math.random() * 5);
          let sx = at;
          for (let k = 0; k < nShard; k++) {
            const w = 14 + Math.random() * 12;
            const h = 18 + Math.random() * (FLOOR_H_MAX - LIFT_H - 18);   // 18-32
            if (stone) obstacles.push({ type: 'stalagmite', x: sx, y: GROUND_Y, w, h });
            else obstacles.push({
              type: 'crystal', solo: true, x: sx, y: GROUND_Y, w, h, c
            });
            sx += w + 3 + Math.random() * 8;
          }
        }
        // whatever the roof already has hanging over this stretch must retract
        // before it is ever seen (it is still off screen right)
        retractRoof(lobe.x, lobe.x + lobe.w);
      } else {
        // ---- the lava geyser ----
        // A squat mound with the column ALREADY fully blown the instant it
        // appears: no warning flash, no rise, no build-up of any kind. It enters
        // the screen spraying at its full height and just stays there, so it
        // reads as one fixed one-jump obstacle rather than an event.
        // Every geyser is the same height (GEYSER_TOP = a single jump) and it is
        // spaced like the stage-2 hotel, so there is always room to land.
        // Look 2: a lobed jet that flips between two frames, so it visibly
        // undulates while it stands there. (v = 0 keeps the old smooth column.)
        const mound = 20 + Math.random() * 4;
        const peak = Math.max(24, GEYSER_TOP - mound);
        obstacles.push({
          type: 'geyser', x: baseX, y: GROUND_Y,
          w: 38 + Math.random() * 10,               // mound footprint
          mound,                                    // mound height
          h: mound + peak,                          // whole height, so isBigObstacle sees it
          peak, hNow: peak,                         // already at full height on entry
          v: 1,                                     // appearance 2 — the lobed jet
          // each jet undulates at its own pace and phase: some flick between the
          // two shapes every 7 frames, some are very slow (up to 26 frames), and
          // they no longer all throb in lockstep
          vRate: 7 + Math.random() * 19,
          vPhase: Math.floor(Math.random() * 97)
        });
      }
    }
  }

  // ==========================================================================
  //  THE ROOF (stage 4) — its own generator, its own clock
  // --------------------------------------------------------------------------
  //  This is deliberately NOT part of spawnObstacle(). It owns ceilTimer, it
  //  never touches spawnTimer, and no floor group ever carries a roof piece.
  //  The two streams cross the screen independently, which is what makes the
  //  cave floor feel busy: the roof no longer eats a spawn slot.
  //
  //  The one thing it does look at is the road below, and only to pick its own
  //  HEIGHT: a low rock is the "do not jump here" sign, and a sign is only fair
  //  where there is nothing to jump. Where a jump is due it hangs high enough
  //  to be scenery. Timing and placement stay blind.
  // ==========================================================================
  function spawnCeilObstacle() {
    const ceil = GROUND_Y - CEIL_GAP;
    // the stretch of road a jump covers — a roof hanging into it would catch a
    // dino that is already committed to a jump over something below
    const arc = Math.round((AIR_GROUNDED - 6) * speed);   // one full jump of road
    let busy = false;
    for (const o of obstacles) {
      if (o.ceil || o.fly) continue;              // only floor hazards matter
      if (o.x + o.w > W + 30 - arc) { busy = true; break; }
    }
    const tag = (pendingAbility !== null) ? pendingAbility : abilityStage;
    // one piece, or occasionally two — a roof that never doubles looks tiled
    const many = Math.random() < 0.22 ? 2 : 1;
    let x = W + 24 + Math.random() * 12;
    for (let i = 0; i < many; i++) {
      let o;
      if (Math.random() < (busy ? 0.5 : 0.4)) {
        // lava seeping through the ceiling: it streams down the whole time it is
        // on screen (see the lavaflow branch in update), so its cap is set here
        // as a growth allowance. Over a jumpable stretch the tip must stay above
        // every head height that stretch can demand; in open road it may hang
        // low, and then it is a sign like the rock below.
        const tipNeed = busy ? 232 + Math.random() * 30 : 148 + Math.random() * 44;
        const lenCap = Math.max(FLOW_LEN0 + 26, CEIL_GAP - tipNeed);
        o = {
          type: 'lavaflow', ceil: true, x: Math.round(x), y: ceil,
          w: 20 + Math.random() * 16, len: FLOW_LEN0,
          grow: lenCap - FLOW_LEN0, x0: null, rate: 0
        };
        if (CEIL_GAP - lenCap < 200) o.low = true;
      } else {
        const tip = busy ? 234 + Math.random() * 42 : 94 + Math.random() * 46;
        o = {
          type: 'stalactite', ceil: true, x: Math.round(x), y: ceil,
          w: 12 + Math.random() * 16,
          len: Math.max(30, Math.min(CEIL_SAFE_LEN, CEIL_GAP - tip))
        };
        if (tip < 200) o.low = true;              // a "do not jump here" sign
      }
      o.ab = tag;                                 // the ability swap waits on it
      // a raised floor takes the air out from under the roof
      const u = liftOverlap(o.x, o.x + (o.w || 16));
      if (u > 0) liftRoofPiece(o, u);
      obstacles.push(o);
      x += (o.w || 16) + 16 + Math.random() * 26;
    }
  }

  // ---- Update ----
  function update() {
    // sky: white for stages 1-2, easing toward black once stage 3 begins
    skyDark += (skyTarget - skyDark) * 0.02;
    // the select screen keeps a live stage-1 run going behind the panel
    if (state === 'menu') { driftWorld(10); return; }
    if (state !== 'playing') return;
    if (toastT > 0) toastT--;              // the card keeps its own clock

    // ---- the 30 s lead-in: "等待。。。" while the screen opens into stage 2 ----
    if (preT > 0) {
      preT--;
      driftWorld(speed);
      if (preT <= 60) targetH = isMobile ? MOBILE_H : BIG_H;  // opens across the wait
                                           // (4px a frame: done exactly when it ends)
      easeHeight();
      if (preT === 0) { enterStage(2, false); spawnTimer = 40; }
      return;
    }

    // ---- the starting gun ----
    // A mode may reserve a lead-in. Nothing moves, nothing spawns and the clock
    // does not run, so the card costs the player no time at all.
    if (introT > 0) { introT--; return; }

    frame++;
    framesSinceSpawn++;                    // frames since the last spawn

    // ---- the run clock ----
    // It counts the seconds the player can actually act through. The finish is
