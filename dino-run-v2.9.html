    // always free, and so is every step of a BLOCKING mode's stage change (the
    // long run) — a short run never stops, so there its seconds are real ones.
    // The clock stops for one thing only: the finish line. A stage change does
    // NOT pause it — the seconds a transition takes are spent out of the stage
    // being entered (the latter one), so the schedule stays on the wall clock
    // and the run is never handed extra time for changing levels.
    const holding = finishing;
    if (phase !== 'ending') {
      // speed ramps with progress and the score rate rides along with it —
      // one point per PX_PER_SCORE of track, at any speed
      const p = Math.min(1, score / winScore);
      const r = speedRange();
      speed = r.s0 + (r.s1 - r.s0) * p;
      if (!holding) { score += speed / PX_PER_SCORE; elapsed++; }
    } else {
      speed = 0;
    }

    // ---- stage schedule ----
    // The stages change on the CLOCK, not on the score. Each mode lists how long
    // it spends in each one. A short mode lets the change happen underneath the
    // run; the long mode queues it and plays it out on a clear screen.
    if (!finishing && phase === null) {
      if (score >= winScore) {
        finishing = true; pendingStage = 5; phase = 'waiting';
      } else if (CAVE_ONLY) {
        const want = stageAt(elapsed / 60);
        if (want !== stage) {
          if (MODES[modeIndex].blocking) { pendingStage = want; phase = 'waiting'; }
          // a short mode: wait until the road has been clear for a full second,
          // so the banner does not land on the heels of the last obstacle
          else if (framesSinceSpawn >= STAGE_GAP_FRAMES) enterStage(want, false);
        }
      } else if (stage < 2 && score >= STAGE2_SCORE) { pendingStage = 2; phase = 'waiting'; }
      else if (stage < 3 && score >= STAGE3_SCORE) { pendingStage = 3; phase = 'waiting'; }
      else if (stage < 4 && score >= STAGE4_SCORE) { pendingStage = 4; phase = 'waiting'; }
    }

    if (phase === 'waiting') {
      // spawning is stopped; the last obstacle has to leave the screen entirely
      // (the filter below only drops one once its right edge is past -10).
      // The ending asks for one more thing: the dino must have landed, so he
      // walks in from a standing start instead of being yanked onto the floor.
      const clear = obstacles.length === 0;
      const ready = pendingStage === 5 ? (clear && dino.onGround) : clear;
      if (ready) {
        const s = pendingStage;
        pendingStage = null;
        if (s === 5) {
          // ---- the ending: he walks up to the crowd ----
          saveBest();
          prepareEnding();
          phase = 'ending'; endT = 0;
        } else {
          enterStage(s, true);            // blocking: play the change out
        }
      }
    }

    if (banner > 0) banner--;
    if (phase === 'banner' && banner <= 0) phase = null;

    // far background mountains fade in from stage 2 onward (ghost gradient)
    farAlpha += ((stage >= 2 ? 1 : 0) - farAlpha) * 0.05;
    // the cave interior only shows once the dino has actually dropped in
    const caveOn = (stage >= 4 && phase !== 'gap') ? 1 : 0;
    caveAlpha += (caveOn - caveAlpha) * 0.05;

    // hold ↓ : duck on the ground (all stages); glide in the air from stage 2.
    // The player keeps full control even while the road is collapsing.
    const dropping = (phase === 'drop');
    dino.duck = dino.onGround && downHeld && !dropping;
    // no gliding on the way down into the cave — you fall, you land, that's it
    dino.gliding = !dino.onGround && downHeld && abilityStage >= 2 && !dropping;

    if (dropping) {
      dino.vy += DROP_G;
      dino.y += dino.vy;
    } else if (dino.gliding) {
      dino.vy += dino.vy > 0 ? 0.18 : 0.55;
      if (dino.vy > 2.8) dino.vy = 2.8;   // terminal glide speed
      dino.y += dino.vy;
    } else {
      dino.vy += 0.8;
      dino.y += dino.vy;
    }

    // over the hole there is nothing to land on, so the dino just keeps falling
    const overHole = gap && (dino.x + 8) > gap.x;
    const crater = (!dropping && !overHole) ? craterUnder() : null;
    // the road right under his feet: a 地形抬升 moves it up with the terrain
    const floorY = floorYAt(dino.x + dino.w / 2);
    if (!dropping && dino.y >= floorY) {
      if (overHole) {
        dino.onGround = false;
      } else if (crater && dino.y < floorY + crater.depth) {
        dino.onGround = false;                 // still falling into the rupture
      } else if (crater) {
        // hit the lava pooled at the bottom of the rupture
        dino.y = floorY + crater.depth; dino.vy = 0; dino.jumps = 0;
        dino.onGround = true;                  // (kept alive only in preview)
        if (!INVINCIBLE) gameOver();
      } else if (dino.y > floorY) {
        // The terrain came up under him: he walks the slope, so his feet follow
        // the road instead of climbing it a few px a frame. The slow climb is
        // only for coming back out of a rupture that has already scrolled past.
        dino.y = dino.onGround ? floorY : Math.max(floorY, dino.y - 5);
        dino.vy = 0; dino.onGround = true; dino.jumps = 0;
      } else {
        dino.y = floorY; dino.vy = 0; dino.onGround = true; dino.jumps = 0;
      }
    }
    // Walking DOWN the far slope: the road drops about speed*0.41 px a frame
    // there, which is faster than gravity can pull him after it on the first
    // frames — so his feet lag, he counts as airborne, and his first press would
    // be spent as the SECOND jump. He is not falling, he is walking: if he was
    // on the road last frame and it has only dropped a step he could walk, put
    // him back on it. A 54px ledge is far bigger than this, so stepping off the
    // end of a plateau is still a drop.
    // the step he may walk down in one frame: the slope's own drop at this
    // speed, plus the frame of gravity that already went in above
    const walkDown = Math.max(12, speed * (LIFT_H / LIFT_RAMP) + 4);
    if (!dropping && dino.onGround && !overHole && !crater && dino.y < floorY &&
        floorY - dino.y <= walkDown) {
      dino.y = floorY; dino.vy = 0;
    }
    // the road fell away under him (the far side of a 地形抬升): he is in the air
    // from that step, not still "standing" on a line that has moved on
    if (!dropping && dino.onGround && dino.y < floorY - 0.5) dino.onGround = false;

    if (phase === 'gap') {
      gap.x -= speed;
      // The camera only takes over once the dino has dropped level with the road
      // surface (and is still on its way down). From there it descends at the
      // dino's own speed, so the dino hangs in the frame while the world rushes
      // up past it.
      if (overHole && dino.y >= GROUND_Y && dino.vy > 0) {
        phase = 'drop';
        edgeX = Math.max(0, gap.x);        // where the road slab broke off
        gap = null;
        caveAlpha = 1;
        dropY0 = dino.y;                   // the fall starts here, at the road line
        camY = 0;                          // camera is still where it was: no shift
        // dino.vy is deliberately left alone: it keeps the speed it came in with
      }
    } else if (phase === 'drop') {
      // The camera moves at the dino's current speed, which holds the dino still
      // in the frame; the surface rises out of view and the cave rises into it,
      // one continuous world just scrolled. The line it holds the dino on walks
      // from the crossing point onto the road line (a fraction of a pixel per
      // frame), so the handover and the touchdown are both seam-free.
      const fallY = GROUND_Y + FALL_DEPTH;
      const t = Math.max(0, Math.min(1, (dino.y - dropY0) / (fallY - dropY0)));
      const k = t * t * (3 - 2 * t);            // smoothstep
      camY = dino.y - (dropY0 + (GROUND_Y - dropY0) * k);
      edgeX = Math.max(0, edgeX - speed);
      if (camY >= FALL_DEPTH) {
        // touched down on the cave floor — one seamless rebase, then carry on
        camY = 0; edgeX = 0;
        dino.y = GROUND_Y; dino.vy = 0; dino.onGround = true; dino.jumps = 0;
        // surface hazards are swept up here rather than at the breach: by now
        // the scene has changed completely, so nothing appears to pop out
        obstacles.length = 0;
        banner = 130; spawnTimer = 45; phase = 'banner';
        spawnPause = MODES[modeIndex].blocking ? 70 : 0;
      }
    } else if (phase === 'ending') {
      endT++;
      // the crowd files in from the right at its own pace and stops where it
      // was always meant to stand — nothing simply pops into existence
      for (const c of crowd) {
        if (c.x > c.rest) c.x = Math.max(c.rest, c.x - c.v);
      }
      // 1) walk over to the crowd, 2) wait two seconds in front of them,
      // 3) walk on into the middle of the group — YOU WIN stays up from there
      if (endT <= END_WALK) {
        dino.x = heroStartX() + (END_STOP_X - heroStartX()) * (endT / END_WALK);
      } else if (endT <= END_WALK + END_WAIT) {
        dino.x = END_STOP_X;
      } else {
        const k = Math.min(1, (endT - END_WALK - END_WAIT) / END_ADV);
        dino.x = END_STOP_X + (END_ADV_X - END_STOP_X) * k;
      }
      dino.y = GROUND_Y; dino.vy = 0; dino.onGround = true; dino.jumps = 0;
      dino.duck = false; dino.gliding = false;     // he just walks and looks
    }

    // clouds (and everything else) hold still for the ending
    if (phase !== 'ending') {
      clouds.forEach(c => { c.x -= c.s; if (c.x < -60) { c.x = W + 20; c.y = 30 + Math.random() * 70; } });

      // mountains drift slowly (parallax); the far layer is slower still
      mountains.forEach(m => {
        m.x -= MOUNTAIN_SPEED;
        if (m.x + m.w < -20) m.x += mountainSpan;
      });
      farMountains.forEach(m => {
        m.x -= FAR_SPEED;
        if (m.x + m.w < -20) m.x += farSpan;
      });
    }

    // spawn — held only while the dino has no control (see spawningPaused)
    if (OBSTACLES_ON && !spawningPaused()) {
      if (spawnPause > 0) {
        spawnPause--;
      } else {
        spawnTimer--;
        if (spawnTimer <= 0) {
          // spacing is FLOOR to FLOOR. A roof piece is not part of this chain
          // at all — it runs on its own clock (see spawnCeilObstacle) — so it
          // must never be the thing a floor gap is measured from.
          let prev = null;
          for (let i = obstacles.length - 1; i >= 0; i--) {
            if (!obstacles[i].ceil) { prev = obstacles[i]; break; }
          }
          const from = obstacles.length;
          spawnObstacle();
          framesSinceSpawn = 0;              // the road is no longer clear
          // one spawn can now be a whole run (a field of crystals / stalagmites),
          // so everything below works on the group, not just its last member
          const added = obstacles.slice(from);
          // Stamp the run with the abilities it needs. Hazards appearing while a
          // change is pending already belong to the NEW stage, so the old ones
          // scrolling away is exactly the signal that the swap can happen.
          const abTag = pendingAbility !== null ? pendingAbility : abilityStage;
          added.forEach(o => { o.ab = abTag; });
          // heavy-run bookkeeping: how many heavy spawns (buildings, geysers,
          // stalactites, gem runs) have come in a row. pickKind() reads this next
          // time and drops the heavy kinds once the difficulty's cap is reached.
          heavyRun = added.some(o => HEAVY[o.type]) ? heavyRun + 1 : 0;
          const first = added[0] || null;
          const last = added[added.length - 1] || null;
          // the run's true footprint. Not first-to-last: a terrain lift carries a
          // hazard up with it and is far wider than the piece at either end, and
          // the next group must not appear on the slope it left behind.
          let gL = Infinity, gR = -Infinity;
          for (const q of added) {
            if (q.x < gL) gL = q.x;
            if (q.x + (q.w || 0) > gR) gR = q.x + (q.w || 0);
          }
          const groupW = gR > gL ? gR - gL : 0;
          // ---- run-up before the NEW group, measured in FRAMES of road ----
          // Everything here is a number of frames, so it is the same stretch of
          // TIME at any speed. Only pace / gapMul scale spacing now; speed does
          // not, which is what stopped a fast run from pinching the design.
          let push = 0;                      // px we shove the new group back by
          if (prev && prev.type === 'lava' && first && !first.fly && !first.ceil) {
            const d = 45 + Math.random() * 45;
            added.forEach(o => o.x += d); push += d;
          }
          // The roof does not know this group is coming — that is the point of
          // the two clocks — so the floor returns the favour: a LOW roof (a rock
          // hanging into jump height) must never sit where a jump begins. About
          // a quarter second of road is all it takes, and the group is still
          // off screen while it is being nudged back.
          if (stage >= 4) {
            let lowR = -Infinity;
            for (const o of obstacles) {
              if (o.ceil && o.low) lowR = Math.max(lowR, o.x + o.w);
            }
            if (first && lowR > -Infinity) {
              const need = 14 * speed;
              const have = first.x - lowR;
              if (have < need) {
                const d = need - have;
                added.forEach(o => o.x += d);
                push += d;
              }
            }
          }
          // ---- 抬升两端的缓冲带 ----
          // A raised stretch bends the road at both of its ends, and a bend is
          // the one place the dino cannot answer with a jump: he is climbing
          // into whatever comes next, or dropping off the crest with no height
          // to spare. So nothing may stand on a slope, nor just past its foot —
          // the group is shoved back until it is on level road again.
          if (stage >= 4 && added.length) {
            const pad = 18 * speed;                 // 18 frames (~0.3 s) of level road
            let need = 0;
            for (const o of obstacles) {
              if (o.type !== 'uplift') continue;
              const foot = o.x + o.w - o.ramp;      // where the way down starts
              const clear = o.x + o.w + pad;        // level road again, this far on
              for (const q of added) {
                if (q === o || q.ceil || q.fly) continue;
                if (q.x > foot && q.x < clear) need = Math.max(need, clear - q.x);
              }
            }
            if (need > 0) { added.forEach(q => { q.x += need; }); push += need; }
          }
          // make sure at least `needF` frames of clear road sit between the
          // previous obstacle and this one, shoving this group back if not
          const needBefore = (needF) => {
            if (!prev || !first) return;
            const have = (first.x - (prev.x + prev.w)) / speed;
            if (have < needF) { const d = (needF - have) * speed; added.forEach(o => o.x += d); push += d; }
          };
          // a big obstacle has to be seen coming and committed to: half a screen
          // of frames between it and whatever came before
          const hasGeyser = added.some(o => o.type === 'geyser');
          const bigRun = groupW >= 110 || added.some(isBigObstacle) || hasGeyser;
          const mxNew = added.reduce((m, o) => Math.max(m, o.extra || 0), 0);
          if (bigRun) needBefore(HALF_SCREEN_F);
          // a mover eats into the gap ahead of it, so it sets off further back
          if (mxNew > 0) needBefore(MOVER_LEAD_F + mxNew * 4);
          // ---- the gap to the NEXT obstacle, in FRAMES ----
          // The numbers were tuned at REF_SPEED and TIME_CAL rescales them so
          // 正常 · 1 分钟 — the reference mode — keeps the density it always had.
          // A gap is now a number of frames, so it is the same stretch of time at
          // any speed: only pace / gapMul move it, never the speed.
          const tightOK = added.length === 1 && last &&
                          !last.fly && last.ceil !== true && last.type !== 'lava' &&
                          last.type !== 'geyser' && !hasGeyser && last.h <= 95;
          let gapF = (stage >= 4 ? 48 : stage >= 2 ? 74 : 60) +
                     Math.random() * (stage >= 4 ? 56 : 80) +
                     Math.max(0, 40 - score);
          // pacing: the distance sets the tightness, the difficulty scales it
          gapF *= MODES[modeIndex].pace * gapMul() * TIME_CAL;
          // In the cave the floor is the whole game: there is no flyer coming
          // across your line and no roof piece eating a slot any more, so the
          // floor itself has to carry the pressure. It runs noticeably tighter
          // than the open stages — this is the "第四阶段太轻松" answer.
          if (stage >= 4) gapF *= 0.88;
          // anything big needs room BEHIND it as well — you land late and short
          // of sight, so the next hazard must not be waiting on the landing spot
          if (bigRun) gapF += (150 + Math.random() * 160) / REF_SPEED * (stage >= 4 ? 0.66 : 1);
          // a ceiling hazard is followed by open floor
          if (last && last.ceil) gapF += (120 + Math.random() * 140) / REF_SPEED;
          // the rhythm-breaker: a hop-over may be followed closely by the next one.
          // In the cave the floor is already running tight, so it only needs to
          // snap shut now and then — otherwise every gap would hit the floor
          // (26 frames) and the run would be one endless double-jump chain.
          if (stage >= 2 && tightOK && Math.random() < (stage >= 4 ? 0.30 : 0.55)) gapF *= 0.45;
          // the 2-minute run hands out the occasional empty stretch late on
          if (MODES[modeIndex].calm && score / winScore > 0.62 && Math.random() < 0.18) {
            gapF += (900 + Math.random() * 700) / REF_SPEED;
          }
          // (the old px-side lava hold / group cross-over / calm holds are folded
          //  into the FRAMES block below)
          // ---- the hard floor, also in FRAMES ----
          // No matter what the pacing maths arrives at, two hazards must never be
          // jammed together. A hair-thin gap reads as one illogical lump, and a
          // heavy obstacle must always leave somewhere to land and read what is
          // next. Tall / wide things and anything hanging from the ceiling get a
          // wider berth; the base is a whole jump of road at any speed.
          const airF = airFrames();
          let minF = Math.max(BASE_MIN_F, airF);
          if (last) {
            // a pool is crossed with a glide — the longest thing the dino does —
            // so the road after it has to be the generous one either way
            if (last.type === 'lava') {
              minF = Math.max(minF, last.w / speed + REAR_POOL_F, AIR_GROUNDED);
            }
            if (last.ceil) minF = Math.max(minF, CEIL_MIN_F);
            if (isBigObstacle(last)) minF = Math.max(minF, BIG_MIN_F);
            // Roof-level hazards and the beam craft are survived from the floor.
            // That is true whether or not a double jump is available — being in
            // the air at all is what kills. So this floor is always the FULL
            // air-time, never the chained one.
            if (FLOORED[last.type]) minF = Math.max(minF, GROUND_MIN_F, AIR_GROUNDED);
          }
          if (hasGeyser) minF = Math.max(minF, BIG_MIN_F);
          // and never let the next hazard appear while this run is still crossing
          // the right-hand edge of the screen
          if (groupW > 0) minF = Math.max(minF, groupW / speed + 40 / REF_SPEED);
          // a hazard you must meet on the ground needs a full jump of clear road
          // in front of it, or you are still airborne when it arrives
          if (added.some(o => FLOORED[o.type])) needBefore(Math.max(GROUND_MIN_F, AIR_GROUNDED));
          gapF = Math.max(gapF, minF);
          // whatever we pushed this group back by, the one behind it waits too —
          // so its own gap keeps the spacing it was meant to have
          if (push > 0) gapF += push / speed;
          // a geyser or a pool keeps the extra trailing stretch asked for earlier;
          // for the geyser this then lands in the upper half of its strict range
          if (last && (last.type === 'geyser' || last.type === 'lava')) {
            gapF *= (stage >= 4 ? 1.22 : REAR_GAP_MUL);
          }

          // ---- a STRICT trailing range after a two-storey building or a geyser
          // The trailing gap is DRAWN inside a bounded range of frames: never so
          // short you are squeezed on landing, never so long the run goes slack.
          // It supersedes the raw multiplier for those two, and the hard floor is
          // still respected; the difficulty's gapMul scales the whole range.
          if (last && (last.type === 'hotel' || last.type === 'geyser')) {
            // the cave's geyser is a one-jump obstacle: 1.9 s of empty road after
            // it is far more than it needs there (the screen is 1.5 s wide)
            const k = gapMul() * (stage >= 4 ? 0.68 : 1);
            const lo = Math.max(minF, REAR_STRICT_LO * k);
            const hi = Math.max(lo, REAR_STRICT_HI * k);
            gapF = lo + Math.random() * (hi - lo);
          } else if (last && (last.type === 'stalactite' || last.type === 'crystal')) {
            // a stalactite or a gem run is handled more loosely: a floor only
            gapF = Math.max(gapF, REAR_LOOSE * gapMul());
          }

          // a mover closes the gap faster than the ground does, so its wait is
          // stretched by the same ratio; the floor in frames keeps a dash from
          // demanding that the player already knew what was coming
          // ---- everything that stands on the road sits where the road IS ----
          // Done last, after every nudge above, so a piece and the slab it stands
          // on can never disagree. A lava crater is the one thing that is cut
          // INTO the road rather than standing on it, so it keeps the flat line.
          added.forEach(o => {
            if (o.ceil || o.fly || o.type === 'uplift' || o.type === 'lava') return;
            o.y = floorYAt(o.x + (o.w || 0) / 2);
          });
          spawnTimer = Math.max(gapF * (1 + mxNew / Math.max(1, speed)), airF);
        }
        // ---- the roof, on a clock of its own ----
        // Runs AFTER the floor spawn of this frame: if both land together the
        // roof already sees the new group and hangs high, so a coincidence can
        // never produce a low rock over a jump. It neither reads spawnTimer nor
        // writes it — the floor's spacing is unchanged by anything up there.
        if (stage >= 4) {
          ceilTimer--;
          if (ceilTimer <= 0) {
            spawnCeilObstacle();
            ceilTimer = Math.max(26, (44 + Math.random() * 58) *
                                 MODES[modeIndex].pace * gapMul());
          }
        }
      }
    }

    // move obstacles — flyers are faster than the ground
    obstacles.forEach(o => {
      o.x -= speed + (o.extra || 0);
      if (o.fly) o.wing = (o.wing + 1) % 2;
      if (o.type === 'lavaflow') {
        // It streams down the whole time it is on screen — it is never frozen to
        // let the dino under. Compute the growth once, from the road left between
        // it and the dino, so the length it has reached on arrival is a constant
        // (= FLOW_LEN0 + FLOW_GROW_ADD) however far it was shoved out to the
        // right, and at any scroll speed. Length is set straight from position,
        // so nothing accumulates frame to frame.
        if (o.x0 == null) {
          // a drip paired with a floor obstacle grows less far (see the pair
          // block), so the growth target is per-obstacle, not a constant
          o.x0 = o.x;
          o.rate = (o.grow == null ? FLOW_GROW_ADD : o.grow) / Math.max(1, o.x0);
        }
        o.len = FLOW_LEN0 + o.rate * (o.x0 - o.x);
      }
    });
    obstacles = obstacles.filter(o => o.x + o.w > -10);

    // the queue for a stage change clears the moment the last hazard belonging
    // to the old ability set has scrolled away
    if (pendingAbility !== null && !obstacles.some(o => o.ab !== pendingAbility)) {
      abilityStage = pendingAbility;
      pendingAbility = null;
    }

    // ground scrolls with the same per-frame displacement as obstacles
    groundOffset += speed;

    // collision (AABB, top-left coordinate system, slight forgiveness)
    // dino.y is the FEET (ground line). Box top = y - height, bottom = y.
    // Skipped entirely while INVINCIBLE (preview mode).
    if (!INVINCIBLE && !collisionOff()) {
      const ducking = dino.duck && dino.onGround;
      const dW = ducking ? dino.w + 8 : dino.w;
      const dH = ducking ? 30 : dino.h;
      const dL = dino.x + 4;          // left
      const dR = dino.x + dW - 4;     // right
      const dT = dino.y - dH + 4;     // top
      const dB = dino.y - 2;          // bottom

      for (const o of obstacles) {
        // stage-3 airship: a vertical search beam — only ducking keeps you hidden
        if (o.type === 'airship') {
          const bw = 34;
          const bl = o.x + o.w / 2 - bw / 2, br = o.x + o.w / 2 + bw / 2;
          if (dR > bl && dL < br && !dino.duck) { gameOver(); break; }
          continue;                    // the hull itself is out of reach
        }
        // a lava crater is a hole in the floor, not a wall: falling in is what
        // gets you, and the ground check below is what judges that
        if (o.type === 'lava') continue;
        // the lifted terrain is the floor he is standing on, not an obstacle
        if (o.type === 'uplift') continue;
        const b = obBox(o);
        if (dR > b.L && dL < b.R && dB > b.T && dT < b.B) {
          gameOver();
          break;
        }
      }
    }

    // The screen height eases toward its target while the world keeps running —
    // no separate phase, so a stage change can never stall the run.
    easeHeight();
  }

  // One easing step toward targetH. Everything above the ground line shifts by
  // the same delta so it stays on the floor. Also used by the 30 s lead-in,
  // which grows the plate before the run proper has started.
  function easeHeight() {
    if (isMobile) targetH = MOBILE_H;     // the phone keeps one frame throughout
    if (H === targetH) return;
    const prevH = H;
    H += Math.sign(targetH - H) * Math.min(Math.abs(targetH - H), 4);
    const delta = H - prevH;
    GROUND_Y = H - GROUND_GAP;
    canvas.height = H;
    dino.y += delta;
    obstacles.forEach(o => o.y += delta);
    clouds.forEach(c => c.y += delta);   // clouds slide down with the ground
  }

  function gameOver() {
    state = 'over';
    saveBest();
  }

  // hitbox in the same top-left convention as the dino
  // a ruptured floor: is the dino's footprint over a lava crater? There is 12px
  // of tolerance at each rim, so clipping the edge of the crack is forgiven.
  function craterUnder() {
    const cx = dino.x + dino.w / 2;
    for (const o of obstacles) {
      if (o.type === 'lava' && o.depth && cx > o.x + 12 && cx < o.x + o.w - 12) return o;
    }
    return null;
  }

  // Obstacles that are tall or wide enough that the player needs room to read
  // them and commit to a jump: a hotel, a big stalagmite or crystal, a charging
  // horse, a hillside, a wide rupture. They get a clear run-up (see spawnTimer).
  function isBigObstacle(o) {
    // The cave's floor pieces all sit under FLOOR_H_MAX now, so the old 70 bar
    // would only ever catch a geyser and the extra run-up would quietly vanish —
    // the floor would come out 20% denser without anyone touching the spacing.
    // In stage 4 the bar moves with the new ceiling, so the tall ones still read
    // as "tall" and still earn their half screen.
    const tall = stage >= 4 ? FLOOR_H_MAX - 4 : 70;
    return !!o && ((o.h || 0) >= tall || (o.w || 0) >= 110);
  }

  function obBox(o) {
    let L = o.x + 4;
    let R = o.x + o.w - 4;
    let T, B;
    if (o.ceil) {
      // hangs down from the ceiling by o.len
      T = o.y + 2;
      B = o.y + o.len - 2;
    } else if (o.fly) {
      T = o.y - o.h / 2 + 3;   // o.y is the flyer's vertical center
      B = o.y + o.h / 2 - 3;
    } else {
      T = o.y - o.h + 4;       // ground hazard grows up from o.y
      B = o.y - 2;
      if (o.type === 'hill') {
        // trim the low tail edges of the mound so it isn't unfair
        L = o.x + o.w * 0.20;
        R = o.x + o.w * 0.80;
      } else if (o.type === 'horse') {
        // it charges fast, so be forgiving: only the lower body counts
        L = o.x + o.w * 0.24;
        R = o.x + o.w * 0.76;
        T = o.y - o.h * 0.58;
        B = o.y - 6;
      } else if (o.type === 'hotel') {
        // tall building — trim top and sides for tolerance
        L = o.x + 8;
        R = o.x + o.w - 8;
        T = o.y - o.h + 14;
        B = o.y - 6;
      } else if (o.type === 'car') {
        // armoured car — trim the roof and bumpers a little
        L = o.x + 6;
        R = o.x + o.w - 6;
        T = o.y - o.h + 8;
        B = o.y - 4;
      } else if (o.type === 'geyser') {
        // mound + column. A few px of grace at the very tip so clipping the
        // crown on the way over is forgiven.
        L = o.x + 6;
        R = o.x + o.w - 6;
        T = o.y - (o.mound + (o.hNow || 0)) + 6;
        B = o.y - 2;
      }
    }
    return { L, R, T, B };
  }

  // ---- Draw ----
  function drawFarMountains() {
    if (farAlpha <= 0.01) return;            // hidden until stage 2 fades it in
    ctx.save();
    ctx.globalAlpha = Math.min(1, farAlpha);
    for (const m of farMountains) {
      const peakY = GROUND_Y - m.h;
      const cx = m.x + m.w / 2;
      // pale brown body (sharp or flat-topped peak)
      ctx.fillStyle = dim('#d7cab9');
      ctx.beginPath();
      if (m.flat) {
        const hw = (m.w * m.topW) / 2;
        ctx.moveTo(m.x, GROUND_Y);
        ctx.lineTo(cx - hw, peakY);
        ctx.lineTo(cx + hw, peakY);
        ctx.lineTo(m.x + m.w, GROUND_Y);
      } else {
        ctx.moveTo(m.x, GROUND_Y);
        ctx.lineTo(cx, peakY);
        ctx.lineTo(m.x + m.w, GROUND_Y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = dim('#c6b6a3');
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // lava cap — a single soft, pale colour (no bright two-tone glow)
      if (m.lava) {
        const lh = m.h * 0.18, lw = m.w * 0.09;
        ctx.fillStyle = dim('#e7b48f');
        ctx.beginPath();
        ctx.moveTo(cx, peakY);
        ctx.lineTo(cx - lw, peakY + lh);
        ctx.lineTo(cx + lw, peakY + lh);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawMountains() {
    for (const m of mountains) {
      const h = m.h;                        // fixed size -> slides with the ground
      const peakY = GROUND_Y - h;
      const cx = m.x + m.w / 2;
      // body — some peaks sharp, some flat-topped
      ctx.fillStyle = dim('#d6e0ea');
      ctx.beginPath();
      if (m.flat) {
        const hw = (m.w * m.topW) / 2;
        ctx.moveTo(m.x, GROUND_Y);
        ctx.lineTo(cx - hw, peakY);
        ctx.lineTo(cx + hw, peakY);
        ctx.lineTo(m.x + m.w, GROUND_Y);
      } else {
        ctx.moveTo(m.x, GROUND_Y);
        ctx.lineTo(cx, peakY);
        ctx.lineTo(m.x + m.w, GROUND_Y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = dim('#c4cfdc');   // faint outline keeps them defined
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // snow cap
      ctx.fillStyle = dim('#ffffff');
      const capH = h * 0.30;
      const capW = m.w * 0.16;
      ctx.beginPath();
      if (m.flat) {
        const hw = (m.w * m.topW) / 2;
        ctx.moveTo(cx - hw, peakY);
        ctx.lineTo(cx + hw, peakY);
        ctx.lineTo(cx + hw * 0.7, peakY + capH);
        ctx.lineTo(cx - hw * 0.7, peakY + capH);
      } else {
        ctx.moveTo(cx, peakY);
        ctx.lineTo(cx - capW, peakY + capH);
        ctx.lineTo(cx - capW * 0.4, peakY + capH - 5);
        ctx.lineTo(cx, peakY + capH + 2);
        ctx.lineTo(cx + capW * 0.4, peakY + capH - 5);
        ctx.lineTo(cx + capW, peakY + capH);
      }
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawGround() {
    // the street is its own element: a solid band with a black border and a
    // white fill, standing a little above the bottom of the canvas
    const top = GROUND_Y + 2;
    ctx.fillStyle = dim('#ffffff');
    ctx.fillRect(0, top, W, H - top);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2;
    ctx.strokeRect(0, top, W, H - top);
    // road markings (moving dashes) — same px/frame as the obstacles
    ctx.strokeStyle = dim('#535353');
    ctx.lineWidth = 2;
    const spacing = 80;
    const off = groundOffset % spacing;
    for (let x = -off; x < W; x += spacing) {
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y + 14);
      ctx.lineTo(x + 18, GROUND_Y + 14);
      ctx.stroke();
    }
    // stage-4 cut-scene: the road up ahead has collapsed into a chasm
    if (gap) {
      const gx = Math.max(0, gap.x);
      const gw = Math.max(0, Math.min(W, gap.x + gap.w) - gx);
      if (gw > 0) {
        // the void — kept lighter than the sky so the breach is unmistakable
        ctx.fillStyle = '#2a2118';
        ctx.fillRect(gx, GROUND_Y - 4, gw, H - GROUND_Y + 4);
        // rock strata inside, so it reads as deep rather than empty
        ctx.fillStyle = '#403425';
        for (let i = 0; i < 3; i++) ctx.fillRect(gx, GROUND_Y + 6 + i * 9, gw, 3);
        ctx.fillStyle = '#140f0a';
        ctx.fillRect(gx, GROUND_Y + 28, gw, H - GROUND_Y);
        // bright cross-section where the road slab snapped off
        ctx.fillStyle = '#efe2c6';
        ctx.fillRect(gap.x - 13, GROUND_Y - 5, 15, 7);
        ctx.fillRect(gap.x - 5, GROUND_Y - 12, 7, 9);
        // jagged teeth crumbling off the rim
        ctx.fillStyle = '#6a5f50';
        for (let i = 0; i < 8; i++) {
          ctx.fillRect(gap.x - 19 + i * 6, GROUND_Y - 5, 5, 5 + (i % 2) * 6);
        }
        // slabs tumbling into the void
        const t = (frame % 90) / 90;
        ctx.fillStyle = '#d5cab1';
        ctx.fillRect(gap.x + 34 + t * 70, GROUND_Y + 2 + t * 30, 15, 6);
        ctx.fillRect(gap.x + 100 + t * 46, GROUND_Y + 10 + t * 24, 11, 5);
      }
    }
  }

  // brown dirt road — gy is the road line (GROUND_Y normally, or the deeper
  // cave line while the camera is following the dino down)
  function drawDirtRoad(gy) {
    const top = gy + 2;
    const bot = gy + 460;                       // run well past the frame
    ctx.fillStyle = '#6d5537';
    ctx.fillRect(0, top, W, bot - top);
    ctx.fillStyle = '#5a452c';
    ctx.fillRect(0, top + 10, W, bot - top - 10);
    ctx.strokeStyle = '#3a2c1b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, top);
    ctx.lineTo(W, top);
    ctx.stroke();
    const spacing = 80;
    const off = groundOffset % spacing;
    ctx.fillStyle = '#4a3826';
    for (let x = -off; x < W; x += spacing) {
      ctx.fillRect(x + 10, gy + 12, 16, 4);
      ctx.fillRect(x + 40, gy + 20, 10, 4);
    }
  }

  // during the drop-in: everything between the underside of the surface road and
  // the top of the cave rock. The breach is only in the road plate — underground
  // it is all solid — so this fills the whole band with the underground backdrop
  // and the bright sky can never show through the gap between the two roads.
  // The surface slab is painted on top of it afterwards.
  function drawUndergroundBackdrop() {
    ctx.fillStyle = '#2a2118';
    ctx.fillRect(0, GROUND_Y + 2, W, EARTH_H);
    ctx.fillStyle = '#403425';                 // rock strata, matches the breach
    for (let i = 0; i < 3; i++) ctx.fillRect(0, GROUND_Y + 6 + i * 9, W, 3);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';        // it darkens as it goes deeper
    ctx.fillRect(0, GROUND_Y + EARTH_H - 40, W, 40);
  }

  // during the drop-in: the thick slab of soil the surface road sits on, seen
  // in cross-section because it broke off at edgeX where the dino fell through
  function drawSurfaceSlab() {
    const top = GROUND_Y + 2;
    const e = Math.max(0, edgeX);
    if (e <= 0) return;
    // the road plate keeps the exact same thickness it has in drawGround, so the
    // very first frame of the drop looks identical to the last frame before it
    const bandH = Math.max(30, H - top);
    ctx.fillStyle = dim('#ffffff');
    ctx.fillRect(0, top, e, bandH);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, top);
    ctx.lineTo(e, top);
    ctx.stroke();
    ctx.strokeStyle = dim('#535353');
    const spacing = 80;
    const off = groundOffset % spacing;
    for (let x = -off; x < e; x += spacing) {
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y + 14);
      ctx.lineTo(x + 18, GROUND_Y + 14);
      ctx.stroke();
    }
    ctx.fillStyle = '#4a3d2c';
    ctx.fillRect(0, top + bandH, e, EARTH_H - bandH);
    ctx.fillStyle = '#5c4c36';
    ctx.fillRect(0, top + bandH, e, 8);
    // bright cross-section where the slab snapped off
    ctx.fillStyle = '#8a7551';
    ctx.fillRect(e - 3, top, 4, EARTH_H);
  }

  function drawCloud(c) {
    ctx.fillStyle = dim('#cfcfcf');
    ctx.beginPath();
    ctx.arc(c.x, c.y, 12, 0, Math.PI * 2);
    ctx.arc(c.x + 14, c.y + 2, 16, 0, Math.PI * 2);
    ctx.arc(c.x + 30, c.y, 12, 0, Math.PI * 2);
    ctx.fill();
  }

  // draw the dino silhouette in one colour, offset by (ox, oy)
  function drawDinoPose(color, ox, oy, withEye) {
    const x = dino.x + ox, y = dino.y + oy;
    ctx.fillStyle = color;
    if (dino.duck && dino.onGround) {
      // ducking body
      ctx.fillRect(x, y - 22, dino.w + 8, 18);
      ctx.fillRect(x + 18, y - 30, 16, 12); // head
      ctx.fillRect(x + 34, y - 26, 10, 4);  // snout
      if (withEye) { ctx.fillStyle = '#b0b0b0'; ctx.fillRect(x + 30, y - 25, 4, 4); ctx.fillStyle = color; } // grey eye
      // legs — identical thickness / position to the standing pose so the
      // feet stay aligned when crouching (and never poke past the road)
      const lp = (frame % 12 < 6) ? 0 : 5;
      ctx.fillRect(x + 4, y - 12, 7, 12 - lp);
      ctx.fillRect(x + 16, y - 12, 7, 12 - (5 - lp));
    } else if (dino.gliding) {
      // gliding pose: arms spread out like wings, legs tucked
      ctx.fillRect(x, y - 38, 26, 26);       // body
      ctx.fillRect(x + 16, y - 47, 22, 16);  // head
      ctx.fillRect(x + 34, y - 41, 10, 8);   // snout
      if (withEye) { ctx.fillStyle = '#fff'; ctx.fillRect(x + 30, y - 44, 4, 4); ctx.fillStyle = color; }
      ctx.fillRect(x - 12, y - 34, 14, 8);   // tail
      ctx.fillRect(x + 2, y - 28, 18, 5);    // front wing
      ctx.fillRect(x - 4, y - 33, 16, 5);    // back wing
      ctx.fillRect(x + 6, y - 12, 22, 9);    // tucked legs
    } else {
      ctx.fillRect(x, y - 38, 26, 26);       // body
      ctx.fillRect(x + 16, y - 47, 22, 16);  // head
      ctx.fillRect(x + 34, y - 41, 10, 8);   // snout
      if (withEye) { ctx.fillStyle = '#fff'; ctx.fillRect(x + 30, y - 44, 4, 4); ctx.fillStyle = color; }
      ctx.fillRect(x - 10, y - 32, 12, 8);   // tail
      ctx.fillRect(x + 24, y - 22, 8, 6);    // front arm
      const lp = (frame % 12 < 6) ? 0 : 5;
      ctx.fillRect(x + 4, y - 12, 7, 12 - lp);
      ctx.fillRect(x + 16, y - 12, 7, 12 - (5 - lp));
    }
  }

  // ---- the ending: a crowd of dinos waiting for him, all facing left ----
  function prepareEnding() {
    crowd = [];
    const tones = ['#535353', '#5f5f5f', '#6b6b6b'];
    let rest = END_CROWD_X, i = 0;
    while (rest < W + 10) {
      crowd.push({
        x: W + 40 + i * 46,                          // they file in from the right
        rest,                                        // where each one settles down
        v: 4.4 + Math.random() * 1.6,                // each at its own walking pace
        s: 0.78 + Math.random() * 0.42,              // a bit of size variety
        hop: Math.floor(Math.random() * 40),         // each on its own beat
        tone: tones[i % tones.length]
      });
      rest += 40 + Math.random() * 32;
      i++;
    }
  }

  function drawCrowd() {
    const save = { x: dino.x, y: dino.y, w: dino.w, h: dino.h,
                   duck: dino.duck, gliding: dino.gliding, onGround: dino.onGround };
    const f0 = frame;
    for (const c of crowd) {
      // they bounce non-stop once he has stopped in front of them
      let lift = 0;
      if (endT > END_WALK) {
        const t = (endT - END_WALK + c.hop) % 34;
        if (t < 17) lift = Math.sin((t / 17) * Math.PI) * 15 * c.s;
      }
      // mirror the pose so they face left, towards the player
      ctx.save();
      ctx.translate(c.x + 22 * c.s, GROUND_Y - lift);
      ctx.scale(-c.s, c.s);
      dino.x = 0; dino.y = 0; dino.w = 44; dino.h = 47;
      dino.duck = false; dino.gliding = false; dino.onGround = true;
      frame = f0 + c.hop;                            // legs out of step too
      // a pale rim so they read against the dark rock
      const b = 1.5;
      for (const o of [[-b, 0], [b, 0], [0, -b], [0, b]]) {
        drawDinoPose('#cfd8e3', o[0], o[1], false);
      }
      drawDinoPose(c.tone, 0, 0, false);
      ctx.restore();
    }
    frame = f0;
    Object.assign(dino, save);
  }

  function drawDino() {
    // stage 3 (night) and stage 4 (the cave) give the dino a solid coloured
    // border/outline — no glow, no backdrop lighting.
    //   stage 3 night : upright = soft white, ducking = black
    //   stage 4 cave  : always pale, so the dino reads against the dark rock
    if (stage >= 3) {
      const b = 2;
      const borderColor = stage >= 4 ? '#e8eef7'
                        : (dino.duck ? '#000000' : '#dfe6ee');
      ctx.save();
      ctx.beginPath();
      // clip so the outline never spills onto the floor — but if the dino has
      // dropped into a rupture, follow it down so its outline is not cut off
      ctx.rect(0, 0, W, Math.max(GROUND_Y, dino.y + 6));
      ctx.clip();
      for (const o of [[-b, 0], [b, 0], [0, -b], [0, b],
                       [-b, -b], [b, -b], [-b, b], [b, b]]) {
        drawDinoPose(borderColor, o[0], o[1], false);
      }
      ctx.restore();
    }
    drawDinoPose('#535353', 0, 0, true);
  }

  function drawObstacle(o) {
    if (o.fly && o.type !== 'airship') drawSpeedLines(o);   // the airship hovers
    switch (o.type) {
      case 'cactus':  drawCactus(o);  break;
      case 'ruin':    drawRuin(o);    break;
      case 'hill':    drawHill(o);    break;
      case 'hotel':   drawHotel(o);   break;
      case 'horse':   drawHorse(o);   break;
      case 'bird':    drawBird(o);    break;
      case 'eagle':   drawEagle(o);   break;
      case 'airship': drawAirship(o); break;
      case 'car':     drawCar(o);     break;
      case 'jet':     drawJet(o);     break;
      case 'crystal':    drawCrystal(o);    break;
      case 'lava':       drawLava(o);       break;
      case 'stalagmite': drawStalagmite(o); break;
      case 'stalactite': drawStalactite(o); break;
      case 'lavaflow':   drawLavaflow(o);   break;
      case 'geyser':     drawGeyser(o);     break;
      case 'uplift':     drawUplift(o);     break;
    }
  }

  // speed streaks trailing a fast flyer (motion is leftward, so trails go right)
  function drawSpeedLines(o) {
    ctx.strokeStyle = 'rgba(130,130,130,0.40)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const ly = o.y - o.h / 2 + 5 + i * (o.h / 3);
      ctx.beginPath();
      ctx.moveTo(o.x + o.w, ly);
      ctx.lineTo(o.x + o.w + 14 + i * 7, ly);
      ctx.stroke();
    }
  }

  function drawCactus(o) {
    const base = o.y, cx = o.x + o.w / 2, h = o.h;
    const v = (o.v || 0) % 3;
    if (v === 1) {
      // tall single column
      const tw = Math.max(10, o.w * 0.36);
      ctx.fillStyle = '#26692c';
      ctx.fillRect(cx - tw / 2, base - h, tw, h);
      ctx.fillStyle = '#1e5624';
      ctx.fillRect(cx - tw / 2, base - h, tw * 0.40, h);          // shaded side
      ctx.fillStyle = '#2f7a36';
      ctx.fillRect(cx + tw * 0.10, base - h, tw * 0.22, h);       // lit edge
    } else if (v === 2) {
      // cluster of three stems of different heights
      const sw = Math.max(8, o.w * 0.24);
      ctx.fillStyle = '#26692c';
      ctx.fillRect(cx - sw * 1.5, base - h * 0.74, sw, h * 0.74);
      ctx.fillRect(cx - sw * 0.5, base - h, sw, h);
      ctx.fillRect(cx + sw * 0.5, base - h * 0.62, sw, h * 0.62);
      ctx.fillStyle = '#1e5624';
      ctx.fillRect(cx - sw * 1.5, base - h * 0.74, sw * 0.38, h * 0.74);
    } else {
      // classic two-arm saguaro
      const tw = Math.max(11, o.w * 0.40);
      const aw = Math.max(8, o.w * 0.28);
      ctx.fillStyle = '#26692c';
      ctx.fillRect(cx - tw / 2, base - h, tw, h);                  // trunk
      const ly = base - h * 0.60;
      ctx.fillRect(cx - tw / 2 - aw, ly, aw, h * 0.32);            // left arm
      ctx.fillRect(cx - tw / 2 - aw, ly + h * 0.32 - aw, aw + tw * 0.5, aw);
      const ry = base - h * 0.76;
      ctx.fillRect(cx + tw / 2, ry, aw, h * 0.28);                 // right arm
      ctx.fillRect(cx + tw / 2 - tw * 0.5, ry + h * 0.28 - aw, aw + tw * 0.5, aw);
    }
  }

  function drawRuin(o) {
    const base = o.y, x = o.x, w = o.w, h = o.h;
    const v = (o.v || 0) % 3;
    if (v === 1) {
      // one tall pillar, not fully collapsed
      const colW = Math.max(14, w * 0.42);
      ctx.fillStyle = '#5f574a';
      ctx.fillRect(x + w * 0.22, base - h, colW, h);
      ctx.fillStyle = '#8d8577';
      ctx.fillRect(x + w * 0.22, base - h, colW * 0.45, h);       // lit face
      ctx.fillStyle = '#9c9485';
      ctx.fillRect(x + w * 0.22 - 5, base - h - 8, colW + 10, 9); // capital
      ctx.fillStyle = '#5f574a';
      ctx.fillRect(x, base - 14, w * 0.34, 14);                   // rubble
      ctx.fillRect(x + w * 0.60, base - 9, w * 0.40, 9);
    } else if (v === 2) {
      // two pillars with a broken lintel
      const colW = Math.max(12, w * 0.22);
      ctx.fillStyle = '#8d8577';
      ctx.fillRect(x, base - h, colW, h);
      ctx.fillRect(x + w - colW, base - h * 0.76, colW, h * 0.76);
      ctx.fillStyle = '#5f574a';
      ctx.fillRect(x - 4, base - h - 9, colW + w * 0.62, 11);     // broken beam
      ctx.fillStyle = '#9c9485';
      ctx.fillRect(x + colW + 5, base - 16, Math.max(7, w * 0.16), 16);
      ctx.fillStyle = '#4f4739';
      ctx.fillRect(x, base - 5, w, 5);
    } else {
      // wide, low collapsed buildings
      ctx.fillStyle = '#8d8577';
      ctx.fillRect(x, base - h * 0.62, w * 0.52, h * 0.62);
      ctx.fillStyle = '#5f574a';
      ctx.fillRect(x + w * 0.40, base - h, w * 0.28, h);
      ctx.fillStyle = '#9c9485';
      ctx.fillRect(x + w * 0.68, base - h * 0.46, w * 0.32, h * 0.46);
      ctx.fillStyle = '#b3ab9c';
      ctx.fillRect(x + w * 0.40, base - h - 5, w * 0.28, 6);      // broken top slab
      ctx.fillStyle = '#4f4739';
      ctx.fillRect(x, base - 6, w, 6);
    }
  }

  function drawHill(o) {
    const base = o.y, x = o.x, w = o.w, h = o.h;
    const v = (o.v || 0) % 3;
    if (v === 1) {
      // rocky ridge with a flat top
      ctx.fillStyle = '#4d6b41';
      ctx.beginPath();
      ctx.moveTo(x, base);
      ctx.lineTo(x + w * 0.18, base - h * 0.92);
      ctx.lineTo(x + w * 0.82, base - h * 0.92);
      ctx.lineTo(x + w, base);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#6b8e5a';
      ctx.fillRect(x + w * 0.18, base - h * 0.92, w * 0.64, h * 0.22);
      ctx.fillStyle = '#3e5735';
      ctx.fillRect(x + w * 0.30, base - h * 0.70, w * 0.16, h * 0.70);
    } else if (v === 2) {
      // double hump
      ctx.fillStyle = '#6b8e5a';
      ctx.beginPath();
      ctx.moveTo(x, base);
      ctx.quadraticCurveTo(x + w * 0.26, base - 1.7 * h, x + w * 0.50, base - h * 0.52);
      ctx.quadraticCurveTo(x + w * 0.74, base - 2 * h, x + w, base);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#4d6b41';
      ctx.beginPath();
      ctx.moveTo(x + w * 0.12, base);
      ctx.quadraticCurveTo(x + w * 0.26, base - 1.3 * h, x + w * 0.42, base - h * 0.34);
      ctx.closePath();
      ctx.fill();
    } else {
      // smooth mound
      ctx.fillStyle = '#6b8e5a';
      ctx.beginPath();
      ctx.moveTo(x, base);
      ctx.quadraticCurveTo(x + w / 2, base - 2 * h, x + w, base);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#4d6b41';
      ctx.beginPath();
      ctx.moveTo(x + w * 0.16, base);
      ctx.quadraticCurveTo(x + w / 2, base - 1.6 * h, x + w * 0.84, base);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawHorse(o) {
    const x = o.x, base = o.y, w = o.w, h = o.h;
    const v = (o.v || 0) % 3;
    const bodyH = h * 0.38;
    const bodyY = base - h * 0.68;
    const legTop = bodyY + bodyH;
    const legLen = base - legTop;
    const coat = v === 1 ? '#402d1b' : (v === 2 ? '#7a4a24' : '#6b4a2f');
    const dark = v === 1 ? '#2b1e11' : (v === 2 ? '#52311a' : '#4d3320');
    ctx.fillStyle = coat;
    ctx.fillRect(x + w * 0.20, bodyY, w * 0.60, bodyH);            // body
    if (v === 2) {
      // with a cowboy rider
      ctx.fillRect(x + w * 0.34, bodyY - h * 0.22, w * 0.16, h * 0.24);  // torso
      ctx.fillRect(x + w * 0.34, bodyY - h * 0.30, w * 0.13, h * 0.09);  // head
      ctx.fillStyle = dark;
      ctx.fillRect(x + w * 0.29, bodyY - h * 0.34, w * 0.23, h * 0.05);  // hat brim
      ctx.fillStyle = coat;
    }
    ctx.fillRect(x + w * 0.10, bodyY - h * 0.20, w * 0.22, h * 0.34);    // neck
    ctx.fillRect(x + w * 0.02, bodyY - h * 0.30, w * 0.18, h * 0.17);    // head
    ctx.fillStyle = dark;
    ctx.fillRect(x + w * 0.15, bodyY - h * 0.30, w * 0.05, h * 0.18);    // mane
    ctx.fillRect(x + w * 0.76, bodyY + bodyH * 0.05, w * 0.12, h * 0.22); // tail
    ctx.fillStyle = v === 1 ? '#31220f' : '#5a3d26';
    const s = (frame % 10 < 5) ? w * 0.07 : -w * 0.05;
    ctx.fillRect(x + w * 0.24 + s, legTop, w * 0.09, legLen);
    ctx.fillRect(x + w * 0.36 - s, legTop, w * 0.09, legLen);
    ctx.fillRect(x + w * 0.54 + s, legTop, w * 0.09, legLen);
    ctx.fillRect(x + w * 0.66 - s, legTop, w * 0.09, legLen);
  }

  function drawHotel(o) {
    const x = o.x, base = o.y, w = o.w, h = o.h;
    const v = (o.v || 0) % 3;
    if (v === 1) {
      // narrow tower block
      ctx.fillStyle = '#95562f';
      ctx.fillRect(x, base - h, w, h);
      ctx.strokeStyle = '#753f20';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, base - h + 1, w - 2, h - 2);
      ctx.fillStyle = '#753f20';
      ctx.fillRect(x - 2, base - h - 6, w + 4, 8);
      ctx.fillStyle = '#ffd98a';
      const rows = Math.max(2, Math.round(h / 26));
      for (let r0 = 0; r0 < rows; r0++) {
        ctx.fillRect(x + w * 0.26, base - h * 0.76 + r0 * (h * 0.17), w * 0.48, h * 0.07);
      }
      ctx.fillStyle = '#57311a';
      ctx.fillRect(x + w * 0.34, base - h * 0.16, w * 0.32, h * 0.16);
    } else if (v === 2) {
      // wide saloon with a porch roof
      ctx.fillStyle = '#a26536';
      ctx.fillRect(x, base - h, w, h);
      ctx.fillStyle = '#753f20';
      ctx.fillRect(x - 4, base - h - 9, w + 8, 11);              // eave
      ctx.fillRect(x - 6, base - h * 0.60, w + 12, 7);           // porch roof
      ctx.fillStyle = '#5f3a20';
      ctx.fillRect(x + w * 0.10, base - h * 0.60, w * 0.06, h * 0.60);  // posts
      ctx.fillRect(x + w * 0.84, base - h * 0.60, w * 0.06, h * 0.60);
      ctx.fillStyle = '#ffd98a';
      ctx.fillRect(x + w * 0.24, base - h * 0.86, w * 0.20, h * 0.10);
      ctx.fillRect(x + w * 0.56, base - h * 0.86, w * 0.20, h * 0.10);
      ctx.fillStyle = '#57311a';
      ctx.fillRect(x + w * 0.40, base - h * 0.22, w * 0.20, h * 0.22);
    } else {
      // classic hotel with sign
      ctx.fillStyle = '#b5744a';
      ctx.fillRect(x, base - h, w, h);
      ctx.strokeStyle = '#8f5a37';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, base - h + 1, w - 2, h - 2);
      ctx.fillStyle = '#8f5a37';
      ctx.fillRect(x - 3, base - h - 8, w + 6, 10);
      ctx.fillStyle = '#f6ead2';
      ctx.fillRect(x + w * 0.14, base - h * 0.88, w * 0.72, h * 0.12);
      ctx.fillStyle = '#8f5a37';
      ctx.font = 'bold ' + Math.max(9, Math.round(w * 0.14)) + 'px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('HOTEL', x + w / 2, base - h * 0.88 + h * 0.09);
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ffd98a';
      const rows = Math.max(2, Math.round(h / 30)), cols = 2;
      const mw = w * 0.20, mh = h * 0.05;
      for (let r0 = 0; r0 < rows; r0++) {
        for (let c = 0; c < cols; c++) {
          ctx.fillRect(x + w * 0.20 + c * (w * 0.42), base - h * 0.68 + r0 * (mh * 2.1), mw, mh);
        }
      }
      ctx.fillStyle = '#6b4630';
      ctx.fillRect(x + w * 0.38, base - h * 0.18, w * 0.24, h * 0.18);
    }
  }

  function drawBird(o) {
    const cx = o.x + o.w / 2, cy = o.y;    // o.y is the center
    const v = (o.v || 0) % 3;
    const wy = o.wing ? -12 : -2;
    // Everything on screen travels LEFT, so a flyer must face left too. The
    // artwork below is authored facing right, so it is mirrored about its own
    // centre rather than re-drawn.
    ctx.save();
    ctx.translate(cx * 2, 0);
    ctx.scale(-1, 1);
    if (v === 1) {
      // long-beaked pterosaur
      ctx.fillStyle = '#474747';
      ctx.fillRect(cx - 12, cy - 4, 26, 10);
      ctx.fillRect(cx + 12, cy - 9, 20, 5);        // long beak
      ctx.fillRect(cx - 19, cy - 3, 8, 4);         // tail
      ctx.fillStyle = '#373737';
      ctx.fillRect(cx - 8, cy + wy, 18, 6);
    } else if (v === 2) {
      // small flock of two
      ctx.fillStyle = '#5a5a5a';
      ctx.fillRect(cx - 10, cy - 8, 20, 7);
      ctx.fillRect(cx + 8, cy - 8, 6, 4);
      ctx.fillStyle = '#464646';
      ctx.fillRect(cx - 6, cy + 2, 18, 7);
      ctx.fillRect(cx + 10, cy + 2, 6, 4);
      ctx.fillStyle = '#333333';
      const w2 = o.wing ? -6 : 2;
      ctx.fillRect(cx - 4, cy - 8 + w2, 12, 4);
      ctx.fillRect(cx - 2, cy + 2 + w2, 12, 4);
    } else {
      ctx.fillStyle = '#4f4f4f';
      ctx.fillRect(cx - 14, cy - 4, 28, 10);
      ctx.fillRect(cx + 10, cy - 8, 10, 6);
      ctx.fillRect(cx - 18, cy - 2, 6, 4);
      ctx.fillStyle = '#3d3d3d';
      ctx.fillRect(cx - 6, cy + wy, 14, 6);
    }
    ctx.restore()
  }

  function drawEagle(o) {
    const cx = o.x + o.w / 2, cy = o.y;
    const v = (o.v || 0) % 3;
    const wy = o.wing ? -16 : -3;
    // Everything on screen travels LEFT, so a flyer must face left too. The
    // artwork below is authored facing right, so it is mirrored about its own
    // centre rather than re-drawn.
    ctx.save();
    ctx.translate(cx * 2, 0);
    ctx.scale(-1, 1);
    const body = v === 2 ? '#3d3122' : '#54412d';
    const wing = v === 2 ? '#4d3e2b' : '#6f573d';
    ctx.fillStyle = body;
    ctx.fillRect(cx - 18, cy - 4, 36, 10);     // body
    ctx.fillRect(cx + 14, cy - 9, 12, 8);      // head
    ctx.fillStyle = '#f7c948';
    ctx.fillRect(cx + 25, cy - 6, 6, 4);       // hooked beak
    ctx.fillStyle = body;
    ctx.fillRect(cx - 26, cy - 3, 9, 7);       // tail
    if (v === 1) {
      ctx.fillStyle = wing;                    // very wide spread wings
      ctx.fillRect(cx - 30, cy + wy, 60, 8);
      ctx.fillRect(cx - 34, cy + wy + 4, 12, 7);
      ctx.fillRect(cx + 22, cy + wy + 4, 12, 7);
    } else if (v === 2) {
      ctx.fillStyle = '#c9c2b0';               // pale-headed sea eagle
      ctx.fillRect(cx + 14, cy - 9, 12, 8);
      ctx.fillStyle = wing;
      ctx.fillRect(cx - 12, cy + wy, 24, 8);
      ctx.fillRect(cx - 22, cy + wy + 3, 12, 6);
      ctx.fillRect(cx + 2, cy + wy + 3, 12, 6);
    } else {
      ctx.fillStyle = wing;
      ctx.fillRect(cx - 12, cy + wy, 24, 8);
      ctx.fillRect(cx - 22, cy + wy + 3, 12, 6);
      ctx.fillRect(cx + 2, cy + wy + 3, 12, 6);
    }
    ctx.restore()
  }

  // ---- stage 3 pursuit vehicles: dark hulls, bright lights ----
  function drawAirship(o) {
    const cx = o.x + o.w / 2, cy = o.y;
    const v = (o.v || 0) % 3;
    // search beam straight down to the ground
    const bw = 34;
    ctx.fillStyle = 'rgba(255,238,160,0.28)';
    ctx.beginPath();
    ctx.moveTo(cx - bw / 2, cy + 10);
    ctx.lineTo(cx + bw / 2, cy + 10);
    ctx.lineTo(cx + bw / 2 + 12, GROUND_Y);
    ctx.lineTo(cx - bw / 2 - 12, GROUND_Y);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,248,205,0.65)';
    ctx.fillRect(cx - bw / 2, cy + 10, bw, 4);
    // dark hull
    ctx.fillStyle = '#252a33';
    if (v === 1) {
      ctx.fillRect(cx - o.w / 2, cy - 10, o.w, 20);
      ctx.fillRect(cx - o.w / 2 - 7, cy - 4, 9, 9);              // side pod
      ctx.fillRect(cx + o.w / 2 - 2, cy - 4, 9, 9);              // side pod
    } else if (v === 2) {
      ctx.fillRect(cx - o.w / 2, cy - 12, o.w, 24);
      ctx.fillRect(cx - o.w * 0.18, cy - 21, o.w * 0.36, 10);    // top dome
      ctx.fillRect(cx - o.w * 0.30, cy + 12, o.w * 0.60, 7);     // gondola
    } else {
      ctx.fillRect(cx - o.w / 2, cy - 8, o.w, 17);
      ctx.fillRect(cx - o.w * 0.30, cy + 9, o.w * 0.60, 6);      // gondola
    }
    ctx.fillStyle = '#12151b';
    ctx.fillRect(cx - o.w / 2, cy + 14, o.w, 3);                 // underside
    // bright lamps + blinking beacon
    ctx.fillStyle = '#d6ecff';
    ctx.fillRect(cx - o.w / 2 + 2, cy - 5, 5, 5);
    ctx.fillRect(cx + o.w / 2 - 7, cy - 5, 5, 5);
    ctx.fillStyle = (frame % 40 < 20) ? '#ff5a4a' : '#6d2620';
    ctx.fillRect(cx - 3, cy + 8, 6, 5);
  }

  function drawCar(o) {
    const x = o.x, base = o.y, w = o.w, h = o.h;
    const v = (o.v || 0) % 3;
    const top = base - h;
    ctx.fillStyle = '#232b36';                                   // hull
    ctx.fillRect(x, top + h * 0.30, w, h * 0.70);
    if (v === 1) {
      ctx.fillStyle = '#161c24';
      ctx.fillRect(x + w * 0.06, top, w * 0.88, h * 0.34);       // armoured deck
      ctx.fillStyle = '#161c24';
      ctx.fillRect(x + w * 0.30, top - h * 0.16, w * 0.40, h * 0.18);  // turret
      ctx.fillStyle = '#3a4453';
      ctx.fillRect(x + w * 0.36, top - h * 0.32, w * 0.07, h * 0.18);  // barrel
    } else if (v === 2) {
      ctx.fillStyle = '#2f3845';
      ctx.fillRect(x + w * 0.10, top, w * 0.80, h * 0.30);
      ctx.fillStyle = '#cfe9ff';
      ctx.fillRect(x + w * 0.16, top + h * 0.06, w * 0.22, h * 0.12);  // windscreen
    } else {
      ctx.fillStyle = '#2f3845';
      ctx.fillRect(x + w * 0.18, top, w * 0.66, h * 0.34);       // cabin
      ctx.fillStyle = '#1a202a';
      ctx.fillRect(x + w * 0.24, top + h * 0.06, w * 0.20, h * 0.12);
    }
    ctx.fillStyle = '#0f1319';                                   // wheels
    const wr = Math.max(6, h * 0.22);
    ctx.fillRect(x + w * 0.12, base - wr, w * 0.24, wr);
    ctx.fillRect(x + w * 0.60, base - wr, w * 0.24, wr);
    ctx.fillStyle = '#ffe89a';                                   // headlight (faces the player)
    ctx.fillRect(x + 1, top + h * 0.44, Math.max(4, w * 0.10), Math.max(4, h * 0.12));
    ctx.fillStyle = (frame % 30 < 15) ? '#ff6a5a' : '#54201a';   // warning lamp
    ctx.fillRect(x + w * 0.44, top - h * 0.10, Math.max(4, w * 0.10), Math.max(4, h * 0.10));
  }

  function drawJet(o) {
    const cx = o.x + o.w / 2, cy = o.y;
    const v = (o.v || 0) % 3;
    ctx.strokeStyle = 'rgba(200,220,255,0.45)';                  // speed streaks
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const ly = cy - 8 + i * 8;
      ctx.beginPath();
      ctx.moveTo(o.x + o.w, ly);
      ctx.lineTo(o.x + o.w + 18 + i * 8, ly);
      ctx.stroke();
    }
    ctx.fillStyle = '#212936';                                   // fuselage
    ctx.fillRect(cx - 26, cy - 5, 52, 11);
    ctx.fillRect(cx + 22, cy - 3, 12, 6);                        // nose
    ctx.fillStyle = '#141a22';
    if (v === 1) {
      ctx.fillRect(cx - 6, cy - 16, 20, 8);                      // high wings
      ctx.fillRect(cx - 6, cy + 8, 20, 8);
    } else if (v === 2) {
      ctx.fillRect(cx - 20, cy - 14, 34, 7);                     // swept wings
      ctx.fillRect(cx - 20, cy + 8, 34, 7);
    } else {
      ctx.fillRect(cx - 10, cy - 13, 26, 7);
      ctx.fillRect(cx - 10, cy + 7, 26, 7);
    }
    ctx.fillRect(cx - 32, cy - 8, 8, 8);                         // tail fin
    ctx.fillStyle = (frame % 8 < 4) ? '#ffd27a' : '#ff9a4a';     // engine glow
    ctx.fillRect(cx - 30, cy - 2, 7, 5);
    ctx.fillStyle = '#9ff2ff';                                   // running light
    ctx.fillRect(cx + 14, cy - 6, 4, 3);
  }

  // ---- stage 4 cave hazards ----
  // ---- 地形抬升: a stretch of road shoved up out of the ground ----
  // Drawn as the same two bands the flat road is made of (a light 10px surface
  // and the darker body under it), following the ramp profile — so the road does
  // not look like something was placed on it, it looks like the road itself is
  // higher here. Nothing else is added on top: the give-away is the lit rim and
  // the fact that everything standing there stands a little higher.
  function drawUplift(o) {
    const L = o.x, R = o.x + o.w, r = o.ramp, h = o.h;
    const base = GROUND_Y + 2;
    const top = (x) => base - h * Math.max(0, Math.min(1, Math.min(x - L, R - x) / r));
    const deep = 74;                                   // cut this far below the road
    const band = (dy, fill) => {
      ctx.beginPath();
      ctx.moveTo(L, base + deep);
      ctx.lineTo(L, top(L) + dy);
      ctx.lineTo(L + r, top(L + r) + dy);
      ctx.lineTo(R - r, top(R - r) + dy);
      ctx.lineTo(R, top(R) + dy);
      ctx.lineTo(R, base + deep);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
    };
    band(0, '#6d5537');         // the road surface, bent up over the lift
    band(10, '#5a452c');        // its darker body, inset the same 10px
    // the same dark border the flat road carries, carried up over the step, so
    // the road reads as continuing rather than as something laid on top of it
    const rim = (dy, color, width) => {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(L, top(L) + dy);
      ctx.lineTo(L + r, top(L + r) + dy);
      ctx.lineTo(R - r, top(R - r) + dy);
      ctx.lineTo(R, top(R) + dy);
      ctx.stroke();
    };
    rim(0, '#3a2c1b', 2);
    rim(2.6, 'rgba(255,236,196,0.30)', 1);   // a catch of light on the cut edge
    // the road's own pebbles, carried up with it, so it still reads as the road
    const off = groundOffset % 80;
    ctx.fillStyle = '#4a3826';
    for (let x = -off; x < W; x += 80) {
      const px = x + 10;
      if (px > L + r + 6 && px < R - r - 46) {
        ctx.fillRect(px, top(px) + 12, 16, 4);
        ctx.fillRect(px + 30, top(px) + 21, 10, 4);
      }
    }
  }

  function drawCrystal(o) {
    const base = o.y, x = o.x, w = o.w, h = o.h;
    const col = CRYSTAL_COLS[(o.c || 0) % 5];
    const shard = (sx, sw, sh) => {
      ctx.beginPath();
      ctx.moveTo(sx + sw / 2, base - sh);
      ctx.lineTo(sx + sw, base - sh * 0.34);
      ctx.lineTo(sx + sw / 2, base);
      ctx.lineTo(sx, base - sh * 0.34);
      ctx.closePath();
      ctx.fill();
    };
    ctx.fillStyle = col;
    if (o.solo) {
      // one shard of a field: a single crystal, so a group of five reads as
      // five separate gems rather than fifteen overlapping ones
      shard(x, w, h);
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath();
      ctx.moveTo(x + w * 0.50, base - h);
      ctx.lineTo(x + w * 0.88, base - h * 0.34);
      ctx.lineTo(x + w * 0.50, base - h * 0.44);
      ctx.closePath();
      ctx.fill();
      return;
    }
    shard(x + w * 0.30, w * 0.40, h);            // main shard
    shard(x, w * 0.30, h * 0.60);                // left shard
    shard(x + w * 0.70, w * 0.30, h * 0.72);     // right shard
    ctx.fillStyle = 'rgba(255,255,255,0.45)';    // facet highlight
    ctx.beginPath();
    ctx.moveTo(x + w * 0.50, base - h);
    ctx.lineTo(x + w * 0.62, base - h * 0.34);
    ctx.lineTo(x + w * 0.50, base - h * 0.44);
    ctx.closePath();
    ctx.fill();
  }

  // the cave floor has ruptured: a crack punched clean through the ground with
  // lava pooled at the bottom. o.depth = road line -> lava surface; o.w = width.
  function drawLava(o) {
    const x = o.x, w = o.w, base = o.y, depth = o.depth;
    const bottom = base + depth;                 // the lava surface
    const lavaH = 11;
    // the cavity: tapered, jagged, darker than anything around it
    ctx.fillStyle = '#16110c';
    ctx.beginPath();
    ctx.moveTo(x - 3, base - 4);
    ctx.lineTo(x + w * 0.09, bottom + lavaH);
    ctx.lineTo(x + w * 0.91, bottom + lavaH);
    ctx.lineTo(x + w + 3, base - 4);
    ctx.closePath();
    ctx.fill();
    // the two walls, faintly lit
    ctx.strokeStyle = '#3b3024';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x - 2, base - 3);
    ctx.lineTo(x + w * 0.095, bottom + lavaH - 2);
    ctx.moveTo(x + w + 2, base - 3);
    ctx.lineTo(x + w * 0.905, bottom + lavaH - 2);
    ctx.stroke();
    // lava pooled in the bottom of the crack
    ctx.fillStyle = '#8c2b0d';
    ctx.fillRect(x + w * 0.09, bottom - lavaH, w * 0.82, lavaH + 4);
    ctx.fillStyle = '#e8562a';
    ctx.fillRect(x + w * 0.10, bottom - lavaH + 3, w * 0.80, lavaH);
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(x + w * 0.14, bottom - lavaH + 5, w * 0.72, 4);
    // churning bubbles
    for (let i = 0; i < 3; i++) {
      const bx = x + w * (0.24 + i * 0.24) + Math.sin((frame + i * 37) / 24) * 5;
      ctx.fillStyle = (frame % 30 < 15 + i * 5) ? '#ffe08a' : '#f79433';
      ctx.fillRect(bx, bottom - lavaH + 6, 7, 3);
    }
    // slabs of floor that came down with the collapse, stuck in the melt
    ctx.fillStyle = '#4a3d2c';
    ctx.fillRect(x + w * 0.17, bottom - lavaH - 3, 13, 7);
    ctx.fillRect(x + w * 0.63, bottom - lavaH - 6, 10, 6);
    ctx.fillRect(x + w * 0.42, bottom - lavaH - 1, 8, 5);
    // heat glow rising out of the rupture
    ctx.fillStyle = 'rgba(255,110,40,0.14)';
    ctx.fillRect(x + w * 0.09, bottom - 52, w * 0.82, 52);
    // broken teeth of floor along both rims
    ctx.fillStyle = '#5b4c39';
    for (let i = 0; i < 5; i++) {
      ctx.fillRect(x - 6 + i * 6, base - 3, 5, 5 + (i % 2) * 6);
      ctx.fillRect(x + w + 6 - i * 6 - 5, base - 3, 5, 5 + ((i + 1) % 2) * 6);
    }
  }

  function drawStalagmite(o) {
    const base = o.y, x = o.x, w = o.w, h = o.h;
    const cx = x + w / 2;
    // a brighter rock than the old grey-brown, so it still reads against the
    // dark cave wall at speed
    ctx.fillStyle = '#a7997f';
    ctx.beginPath();
    ctx.moveTo(cx, base - h);
    ctx.lineTo(x + w, base);
    ctx.lineTo(x, base);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#cdbfa1';                   // lit face
    ctx.beginPath();
    ctx.moveTo(cx, base - h);
    ctx.lineTo(cx + w * 0.22, base);
    ctx.lineTo(cx - w * 0.06, base);
    ctx.closePath();
    ctx.fill();
    // a thin, pale rim right along both slopes: the edge catches the cave glow,
    // which is what stops it reading as one flat silhouette
    ctx.strokeStyle = 'rgba(255, 248, 226, 0.60)';   // lit side
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(cx, base - h);
    ctx.lineTo(x + w, base);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255, 248, 226, 0.24)';   // shadow side, softer
    ctx.beginPath();
    ctx.moveTo(cx, base - h);
    ctx.lineTo(x, base);
    ctx.stroke();
    // and one small catch of light on the very tip
    ctx.fillStyle = 'rgba(255, 252, 238, 0.8)';
    ctx.beginPath();
    ctx.arc(cx, base - h + 1.4, 1.1, 0, Math.PI * 2);
    ctx.fill();
  }


  function drawStalactite(o) {
    const x = o.x, w = o.w, top = o.y, len = o.len;
    const cx = x + w / 2;
    // same brighter rock family as the floor stalagmite
    ctx.fillStyle = '#9a8d77';
    ctx.beginPath();
    ctx.moveTo(x, top);
    ctx.lineTo(x + w, top);
    ctx.lineTo(x + w * 0.62, top + len * 0.72);
    ctx.lineTo(cx, top + len);
    ctx.lineTo(x + w * 0.38, top + len * 0.72);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#c3b699';                   // lit face
    ctx.beginPath();
    ctx.moveTo(x + w * 0.30, top);
    ctx.lineTo(x + w * 0.52, top);
    ctx.lineTo(cx, top + len * 0.78);
    ctx.closePath();
    ctx.fill();
    // the same shallow rim as the floor rock: both slopes catch a thin highlight
    ctx.strokeStyle = 'rgba(255, 248, 226, 0.56)';   // lit side
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(x + w, top);
    ctx.lineTo(x + w * 0.62, top + len * 0.72);
    ctx.lineTo(cx, top + len);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255, 248, 226, 0.22)';   // shadow side, softer
    ctx.beginPath();
    ctx.moveTo(x, top);
    ctx.lineTo(x + w * 0.38, top + len * 0.72);
    ctx.lineTo(cx, top + len);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255, 252, 238, 0.75)';     // a catch of light at the tip
    ctx.beginPath();
    ctx.arc(cx, top + len - 1.2, 1.1, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawLavaflow(o) {
    const x = o.x, w = o.w, top = o.y, len = o.len;
    ctx.fillStyle = '#8c2b0d';                   // crusted rock around the flow
    ctx.fillRect(x, top, w, len * 0.45);
    ctx.fillStyle = '#e8562a';                   // molten column
    ctx.fillRect(x + w * 0.18, top, w * 0.64, len);
    ctx.fillStyle = '#ffd166';                   // hot core
    ctx.fillRect(x + w * 0.34, top, w * 0.32, len);
    // a couple of bright blobs sliding all the way down the column on a loop, so
    // the flow clearly reads as *moving* even between the frames where it has
    // only lengthened by a pixel or two
    ctx.fillStyle = '#fff0b8';
    for (let i = 0; i < 2; i++) {
      const t = (frame * 0.045 + i / 2) % 1;
      const dy = top + len * (0.20 + 0.74 * t);
      ctx.globalAlpha = 0.8 * (1 - Math.abs(t - 0.5) * 1.1);
      ctx.beginPath(); ctx.arc(x + w / 2, dy, w * 0.15, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // glowing droplet at the tip
    ctx.fillStyle = (frame % 24 < 14) ? '#ffd166' : '#e8562a';
    ctx.beginPath();
    ctx.arc(x + w / 2, top + len, w * 0.30, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- the lava geyser ----
  // A squat rocky mound with a hot vent and a column already at full height.
  // Deliberately static: the column exists the moment the geyser comes on screen
  // and does not move at all, so it reads as one fixed obstacle.
  function drawGeyser(o) {
    const x = o.x, w = o.w, base = o.y, mh = o.mound, cx = x + w / 2;

    // the mound itself — squat and dark, with a glowing vent on top
    ctx.fillStyle = '#4a3f33';
    ctx.beginPath();
    ctx.moveTo(x, base);
    ctx.lineTo(x + w * 0.16, base - mh * 0.55);
    ctx.lineTo(x + w * 0.40, base - mh);
    ctx.lineTo(x + w * 0.60, base - mh);
    ctx.lineTo(x + w * 0.84, base - mh * 0.55);
    ctx.lineTo(x + w, base);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#5d5040';
    ctx.beginPath();
    ctx.moveTo(x + w * 0.30, base);
    ctx.lineTo(x + w * 0.42, base - mh);
    ctx.lineTo(x + w * 0.58, base - mh);
    ctx.lineTo(x + w * 0.70, base);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ff8a3d';                    // the vent stays lit
    ctx.fillRect(x + w * 0.36, base - mh * 0.55, w * 0.28, 3);
    ctx.fillRect(x + w * 0.40, base - mh - 1, w * 0.20, 4);

    const h = o.hNow || o.peak || 0;              // always full height now
    if (h <= 0) return;
    const top = base - mh - h;
    const bw = w * 0.46;                          // column width at the vent

    // ---- look 2: a lobed, throbbing jet ----
    // The column is a stack of overlapping lobes whose bulges travel upward, and
    // the whole profile swaps between TWO frames every few ticks — so it reads as
    // churning lava while still standing straight up at the same height.
    if (o.v === 1) {
      // per-jet rate and phase: 7 frames is brisk, 26 is a lazy, almost still
      // swell. Sharing one clock made every column in the cave pulse together.
      const f2 = Math.floor((frame + (o.vPhase || 0)) / (o.vRate || 7)) % 2;
      const phase = f2 ? Math.PI : 0;
      const LOBES = 5, seg = h / LOBES;

      ctx.fillStyle = '#e8562a';                  // outer body
      for (let i = 0; i < LOBES; i++) {
        const t = i / (LOBES - 1);
        const cy = base - mh - seg * 0.5 - seg * i;
        const bulge = 0.5 + 0.5 * Math.sin(phase + t * Math.PI * 2.1);
        const rw = bw * (0.62 - 0.28 * t) * (0.80 + 0.40 * bulge);
        ctx.beginPath();
        ctx.ellipse(cx, cy, rw, seg * 0.74, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#ffd166';                  // hot core, a thinner strand
      for (let i = 0; i < LOBES; i++) {
        const t = i / (LOBES - 1);
        const cy = base - mh - seg * 0.5 - seg * i;
        const bulge = 0.5 + 0.5 * Math.sin(phase + 1.9 + t * Math.PI * 2.1);
        const rw = bw * (0.28 - 0.13 * t) * (0.85 + 0.35 * bulge);
        ctx.beginPath();
        ctx.ellipse(cx, cy, rw, seg * 0.62, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // the crown swaps between two silhouettes as well (kept short, so the
      // drawing never rises above the height a single jump can clear)
      ctx.fillStyle = '#ffb347';
      if (f2 === 0) {
        for (let i = -2; i <= 2; i++) {
          const px = cx + i * bw * 0.29;
          const ph = 6.5 + (2 - Math.abs(i)) * 4;
          ctx.beginPath();
          ctx.moveTo(px - 4.5, top + 3);
          ctx.lineTo(px, top - ph);
          ctx.lineTo(px + 4.5, top + 3);
          ctx.closePath();
          ctx.fill();
        }
      } else {
        ctx.beginPath();
        ctx.moveTo(cx - bw * 0.76, top + 4);
        ctx.quadraticCurveTo(cx - bw * 0.34, top - 14, cx - bw * 0.06, top - 8);
        ctx.quadraticCurveTo(cx + bw * 0.34, top - 17, cx + bw * 0.78, top + 4);
        ctx.closePath();
        ctx.fill();
      }
      return;
    }

    ctx.fillStyle = '#e8562a';
    ctx.beginPath();
    ctx.moveTo(cx - bw / 2, base - mh + 2);
    ctx.lineTo(cx - bw * 0.30, top);
    ctx.lineTo(cx + bw * 0.30, top);
    ctx.lineTo(cx + bw / 2, base - mh + 2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffd166';                    // molten core
    ctx.beginPath();
    ctx.moveTo(cx - bw * 0.22, base - mh + 2);
    ctx.lineTo(cx - bw * 0.10, top + 6);
    ctx.lineTo(cx + bw * 0.10, top + 6);
    ctx.lineTo(cx + bw * 0.22, base - mh + 2);
    ctx.closePath();
    ctx.fill();

    // a fixed crown — a splash silhouette with no motion at all
    ctx.fillStyle = '#ffb347';
    for (let i = -2; i <= 2; i++) {
      const px = cx + i * bw * 0.26;
      const ph = 8 + (2 - Math.abs(i)) * 5;
      ctx.beginPath();
      ctx.moveTo(px - 4, top + 2);
      ctx.lineTo(px, top - ph);
      ctx.lineTo(px + 4, top + 2);
      ctx.closePath();
      ctx.fill();
    }
  }

  // "m:ss.t" — the run clock, in the same units the score is measured in.
  // Rounding to tenths happens FIRST, otherwise 119.98 s prints as "1:60.0".
  // whole seconds — the phone's rail does not need a digit changing ten times a
  // second
  function clockShort(steps) {
    const t = Math.round(steps / 60);
    return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  }
  function clock(steps) {
    const t = Math.round(steps / 6) / 10;
    const m = Math.floor(t / 60);
    const s = t - m * 60;
    return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
  }

  // The score a run has after `sec` seconds of play. Inverting the same integral
  // the target came from: p(f) = (s0/(s1-s0)) * (exp(B*f) - 1), B = (s1-s0)/(PX*win)
  function scoreAtTime(sec) {
    const r = speedRange();
    const B = (r.s1 - r.s0) / (PX_PER_SCORE * winScore);
    const k = r.s0 / (r.s1 - r.s0);
    return winScore * k * (Math.exp(B * sec * 60) - 1);
  }

  // The bar only exists from stage 2 onward, so its left end is wherever the run
  // stood when the bar appeared — NOT the start of the track. A 60 s run would
  // otherwise pop the bar in already 13 % full, carrying a stage-1 slice that
  // was over before there was anything to watch. Measured from that point the
  // bar always starts empty and ends full.
  function barBase() {
    let t = 0;
    for (const seg of MODES[modeIndex].plan) {
      if (seg[0] >= 2) break;          // the bar shows from stage 2 on
      t += seg[1];
    }
    return scoreAtTime(t);             // 0 for a mode that opens in stage 2
  }
  // 0 at the moment the bar appears, 1 at the finish line
  function barProgress() {
    const b = barBase(), span = winScore - b;
    if (span <= 0) return 1;
    return Math.max(0, Math.min(1, (score - b) / span));
  }
  // Where the stage changes land on the bar, as a fraction of the whole track.
  // Because 1 point is always 73.33 px of track, these are the same marks in
  // score and in distance. They are NOT evenly spaced: the dino covers far more
  // ground per second later on, so the last stage owns a bigger slice of track
  // than it does of the clock.
  function stageMarks() {
    const plan = MODES[modeIndex].plan;
    const out = [];
    let t = 0;
    for (let i = 0; i < plan.length - 1; i++) {     // the last mark is the finish
      t += plan[i][1];
      out.push(scoreAtTime(t) / winScore);
    }
    return out;
  }

  // ---- the top display box ----
  // Three readouts and a bar, nothing else: speed on the left, the countdown in
  // the middle, the score on the right, and the track bar underneath them. The
  // ink flips to pale once the world goes dark (the cave, or stage 3's night),
  // because the box sits over the sky.
  const HUD_BAR_Y = 40, HUD_BAR_H = 5;

  // ---- the achievement card ----
  // A stage change also changes what the dino can do. Instead of leaving that to
  // the STAGE sign, a small card slides in under the help button and names what
  // just changed. It takes no input and runs on its own clock, so a pause
  // freezes it along with everything else.
  const TOASTS = {
    2: { head: '能力变化', tone: '#1f7a55', pale: '#4fbf8f',
         rows: [['二段跳', '已开启'], ['滑翔', '已启动']] },
    3: { head: '能力变化', tone: '#1f7a55', pale: '#4fbf8f',
         rows: [['二段跳', '已开启'], ['滑翔', '已启动']] },
    4: { head: '成就达成', tone: '#8a6a1c', pale: '#e0b44a',
         rows: [['二段跳', '已开启'], ['深入地下', '成就达成']] },
  };
  const TOAST_LIFE = 156;                // ~2.6 s: 12 in, 124 hold, 20 out
  let toastT = 0, toastStage = 0;

  // The two buttons now sit inside the canvas corner, so the top strip has to
  // keep clear of them. On a scaled-down canvas the same 56 CSS pixels cover
  // more logical pixels, so the inset is measured instead of guessed: 78 at
  // 800 wide, roughly 141 on a 375-wide phone.
  function hudScale() {
    const cw = canvas.clientWidth || W;
    return cw > 0 ? cw / W : 1;
  }
  // The buttons are CSS pixels, the HUD is logical pixels, and the canvas is
  // scaled to fit — so the size has to live in one place and be read back.
  // 5% of the canvas width: 40px at the full 800, 26px on a 375-wide phone.
  // They used to be 56 / 32 and read as furniture rather than as controls.
  let hudSize = 40;
  const stageBox = document.getElementById('stage');
  function layoutHud() {
    const cw = canvas.clientWidth || W;
    hudSize = Math.max(26, Math.min(40, Math.round(cw * 0.05)));
    stageBox.style.setProperty('--hud', hudSize + 'px');
  }
  function hudEdgePad() {
    const sc = hudScale();
    // left inset + the disc + a gap, all converted back to logical pixels
    return Math.round((hudSize * 0.21 + hudSize + 10) / (sc || 1));
  }
